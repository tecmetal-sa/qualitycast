<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo · Tecmetal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   SORTEO EN VIVO · se maneja con ESPACIO (o el botón)
   F = pantalla completa · M = silenciar sonido
   ========================================================= */
:root{
  --bg:#0D1624;
  --panel:#142036;
  --panel2:#1A2942;
  --line:#26374F;
  --text:#E8EEF7;
  --muted:#8C9DB8;
  --oro:#E9C46A;
  --oro2:#F5B83D;
  --ok:#34C77B;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{font-size:min(calc(100vw / 120), calc(100vh / 67.5))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
body{
  display:grid;
  grid-template-columns:minmax(0,1fr) 34rem;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "main lista" "pie pie";
  gap:1.2rem;
  padding:1.5rem 2rem;
  height:100vh;
}

header{grid-area:head;display:flex;justify-content:space-between;align-items:flex-end;gap:2rem}
.titulo{font:700 4.2rem/1 var(--cond);color:var(--oro)}
.subtitulo{font:500 1.9rem/1.2 var(--sans);color:var(--muted);margin-top:.4rem}
.hora{font:700 3.2rem/1 var(--cond);font-variant-numeric:tabular-nums;text-align:right}
.fecha{font:500 1.3rem/1.2 var(--sans);color:var(--muted);text-align:right;margin-top:.2rem}

main{grid-area:main;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1.2rem;min-height:0}

/* Ventana del sorteo */
.ventana{
  position:relative;background:var(--panel);border-radius:1rem;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:.3rem solid var(--line);transition:border-color .4s ease, box-shadow .4s ease;
}
.ventana.girando{border-color:var(--oro2)}
.ventana.ganador{border-color:var(--oro);box-shadow:0 0 4rem rgba(233,196,106,.35)}
.etiqueta{font:600 2rem/1 var(--cond);color:var(--muted);letter-spacing:.02em}
.ventana.ganador .etiqueta{color:var(--oro)}
.nombre{
  font:700 8.5rem/1 var(--cond);text-align:center;padding:0 2rem;margin-top:1.2rem;
  white-space:nowrap;max-width:100%;overflow:hidden;
}
.nombre.tic{animation:tic .12s ease-out}
@keyframes tic{from{transform:translateY(-18%);opacity:.35}to{transform:none;opacity:1}}
.ventana.ganador .nombre{color:var(--oro);animation:latido 1.1s ease-in-out 3}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ayuda{font:500 1.6rem/1.3 var(--sans);color:var(--muted);margin-top:1.6rem}

/* Ganadores */
.ganadores{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1.2rem}
.premio{
  background:var(--panel);border-radius:.8rem;padding:1.1rem 1.4rem;min-width:0;
  border:.2rem dashed var(--line);display:flex;align-items:center;gap:1.1rem;
}
.premio svg{width:4.2rem;height:4.2rem;flex:none;opacity:.35;transition:opacity .4s}
.premio .pos{font:600 1.4rem/1 var(--cond);color:var(--muted)}
.premio .quien{font:700 2.2rem/1.1 var(--cond);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.25rem}
.premio.lleno{border:.2rem solid var(--oro);background:var(--panel2)}
.premio.lleno svg{opacity:1}
.premio.lleno .quien{color:var(--oro)}

/* Participantes */
.lista{grid-area:lista;background:var(--panel);border-radius:1rem;padding:1.2rem 1.4rem;display:flex;flex-direction:column;min-height:0}
.lista h2{font:600 1.6rem/1 var(--cond);color:var(--muted)}
.lista ul{list-style:none;margin-top:.9rem;columns:2;column-gap:1.4rem;flex:1;min-height:0;overflow:hidden}
.lista li{font:500 1.25rem/1.55 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;break-inside:avoid}
.lista li.gano{color:var(--oro);font-weight:600}
.lista li.gano::before{content:"★ "}

footer{grid-area:pie;display:flex;justify-content:space-between;align-items:center;gap:2rem}
.boton{
  font:700 2rem/1 var(--cond);color:#1E1400;background:var(--oro);border:none;border-radius:.7rem;
  padding:1rem 2.6rem;cursor:pointer;white-space:nowrap;flex:none;
}
.boton:disabled{background:var(--line);color:var(--muted);cursor:default}
.teclas{font:500 1.15rem/1.3 var(--sans);color:var(--muted);white-space:nowrap}
.registro{font:500 1.2rem/1.3 var(--sans);color:var(--muted);flex:1}

#confeti{position:fixed;inset:0;pointer-events:none;z-index:10}
.aviso{font:600 2.2rem/1.3 var(--sans);color:var(--muted);text-align:center;padding:2rem}
@media (prefers-reduced-motion: reduce){
  .nombre.tic,.ventana.ganador .nombre{animation:none}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="titulo" id="titulo">Sorteo</div>
    <div class="subtitulo" id="subtitulo">Cargando participantes…</div>
  </div>
  <div>
    <div class="hora" id="hora">--:--</div>
    <div class="fecha" id="fecha"></div>
  </div>
</header>

<main>
  <div class="ventana" id="ventana">
    <div class="etiqueta" id="etiqueta">Preparados…</div>
    <div class="nombre" id="nombre">¿Quién gana?</div>
    <div class="ayuda" id="ayuda">Presioná ESPACIO para sortear</div>
  </div>
  <div class="ganadores" id="ganadores"></div>
</main>

<aside class="lista">
  <h2 id="listaTitulo">Participantes</h2>
  <ul id="participantes"></ul>
</aside>

<footer>
  <button class="boton" id="boton" disabled>Sortear</button>
  <div class="registro" id="registro"></div>
  <div class="teclas">ESPACIO sortear · F pantalla completa · M sonido</div>
</footer>

<canvas id="confeti"></canvas>

<script>
/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const CONFIG = {
  SHEET_ID: '1BTYqyVgdtOOkdsx7YfNxxmshRtk-o81y9d45ICE1ZNM',
  HOJA_RECONOCIMIENTOS: 'Reconocimientos',
  HOJA_SORTEO: 'Sorteo',
  // Valores por defecto: se reemplazan por la última fila de la pestaña Sorteo si existe
  CATEGORIA: 'Asistencia perfecta',
  PREMIO: '3 giftcards',
  CANTIDAD: 3,
  DURACION_GIRO_MS: 7000            // cuánto tarda en frenar cada sorteo
};
const DEMO = new URLSearchParams(location.search).has('demo');

/* =========================================================
   UTILIDADES (mismas que pantalla.html)
   ========================================================= */
const $ = id => document.getElementById(id);
function norm(s){
  return (s == null ? '' : String(s)).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
}
function parseCSV(text){
  const rows = []; let row = []; let f = ''; let q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else {
      if (c === '"') q = true;
      else if (c === ','){ row.push(f); f = ''; }
      else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function gvizUrl(hoja){
  return 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID +
         '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(hoja) + '&_=' + Date.now();
}
async function leerHojaOpcional(nombre, requeridas){
  const res = await fetch(gvizUrl(nombre), {cache:'no-store'});
  if (!res.ok) return null;
  const txt = await res.text();
  if (txt.trim().startsWith('<')) return null;
  const rows = parseCSV(txt);
  if (!rows.length) return null;
  const h = rows[0].map(norm);
  if (!requeridas.every(r => h.includes(r))) return null;
  return {h, rows: rows.slice(1)};
}
function esInactivo(v){ const a = norm(v); return a === 'no' || a === 'false' || a === '0'; }
function fmtHora(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function minusculaInicial(t){ return t ? t.charAt(0).toLowerCase() + t.slice(1) : t; }

/* Entero al azar en [0, n) con el generador criptográfico del navegador (sin sesgo) */
function azar(n){
  const max = Math.floor(0xFFFFFFFF / n) * n;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= max);
  return buf[0] % n;
}

/* =========================================================
   ESTADO
   ========================================================= */
const S = {
  categoria: CONFIG.CATEGORIA,
  premio: CONFIG.PREMIO,
  cantidad: CONFIG.CANTIDAD,
  participantes: [],
  ganadores: [],
  girando: false,
  sonido: true
};

/* =========================================================
   CARGA
   ========================================================= */
async function cargar(){
  try{
    if (DEMO){
      S.participantes = ['Castel Atilio','Esquivel Cristian','Iglesias Roberto','Ledesma José','Miedan Javier',
        'Oviedo Marcelo','Quispe Pedro','Robles Arnaldo','Sosa Ramón','Torres Lucas','Vélez Julio','Zárate Hugo',
        'Acosta Martín','Benítez Raúl','Cabrera Diego','Domínguez Luis','Fernández Ariel','Giménez Omar',
        'Herrera Pablo','Juárez Néstor','Luna Sergio','Medina Carlos','Núñez Hernán','Paz Gustavo','Ríos Daniel'];
    } else {
      // Configuración desde la última fila de la pestaña Sorteo (opcional)
      const sorteo = await leerHojaOpcional(CONFIG.HOJA_SORTEO, ['premio']).catch(() => null);
      if (sorteo){
        const {h, rows} = sorteo;
        const fila = rows.filter(r => r.some(c => String(c).trim())).pop();
        if (fila){
          const g = n => { const i = h.indexOf(n); return i >= 0 && fila[i] != null ? String(fila[i]).trim() : ''; };
          if (g('premio')) S.premio = g('premio');
          if (g('participantes')) S.categoria = g('participantes');
          const cant = parseInt(g('cantidad'), 10) || parseInt((S.premio.match(/\d+/) || [])[0], 10);
          if (cant > 0) S.cantidad = cant;
        }
      }
      const rec = await leerHojaOpcional(CONFIG.HOJA_RECONOCIMIENTOS, ['categoria','nombre']);
      if (!rec) throw new Error('No pude leer la pestaña Reconocimientos');
      const {h, rows} = rec;
      const iCat = h.indexOf('categoria'), iNom = h.indexOf('nombre'), iAct = h.indexOf('activo');
      const vistos = new Set();
      rows.forEach(r => {
        const nombre = String(r[iNom] || '').trim();
        if (!nombre) return;
        if (norm(r[iCat]) !== norm(S.categoria)) return;
        if (iAct >= 0 && esInactivo(r[iAct])) return;
        const clave = norm(nombre);
        if (vistos.has(clave)) return;          // si alguien quedó cargado dos veces, participa una sola vez
        vistos.add(clave);
        S.participantes.push(nombre);
      });
    }
    S.cantidad = Math.min(S.cantidad, S.participantes.length);
    armar();
  } catch (e){
    console.error(e);
    $('subtitulo').textContent = 'No pude cargar los participantes. Revisá la conexión y recargá la página.';
  }
}

/* =========================================================
   ARMADO DE LA PANTALLA
   ========================================================= */
const REGALO_SVG =
  '<svg viewBox="0 0 100 100" aria-hidden="true">' +
  '<rect x="12" y="40" width="76" height="50" rx="6" fill="#F2544F"/>' +
  '<rect x="6" y="28" width="88" height="18" rx="5" fill="#F27A75"/>' +
  '<rect x="44" y="28" width="12" height="62" fill="#E9C46A"/>' +
  '<path d="M50 28 C38 6 18 14 30 26 Z M50 28 C62 6 82 14 70 26 Z" fill="#E9C46A"/>' +
  '</svg>';

function armar(){
  const n = S.participantes.length;
  $('titulo').textContent = 'Sorteo de ' + S.premio;
  $('subtitulo').textContent = n
    ? 'Entre las ' + n + ' personas con ' + minusculaInicial(S.categoria)
    : 'No hay participantes cargados en la categoría "' + S.categoria + '"';
  $('listaTitulo').textContent = 'Participantes (' + n + ')';

  const ul = $('participantes');
  ul.textContent = '';
  S.participantes.forEach(nombre => {
    const li = document.createElement('li');
    li.textContent = nombre;
    li.dataset.nombre = nombre;
    ul.appendChild(li);
  });
  // Si la lista es larga, achica la letra para que entren todos
  ajustarLista();

  const cont = $('ganadores');
  cont.style.setProperty('--n', Math.max(1, S.cantidad));
  cont.textContent = '';
  for (let i = 0; i < S.cantidad; i++){
    const d = document.createElement('div');
    d.className = 'premio';
    d.innerHTML = REGALO_SVG + '<div style="min-width:0"><div class="pos"></div><div class="quien">?</div></div>';
    d.querySelector('.pos').textContent = (i + 1) + '° ganador';
    cont.appendChild(d);
  }

  $('boton').disabled = n === 0;
  if (!n) $('ayuda').textContent = 'Cargá los participantes en la planilla y recargá la página';
}

function ajustarLista(){
  const ul = $('participantes');
  let size = 1.25;
  ul.querySelectorAll('li').forEach(li => li.style.fontSize = '');
  while (ul.scrollHeight > ul.clientHeight + 2 && size > .7){
    size -= .05;
    ul.querySelectorAll('li').forEach(li => li.style.fontSize = size + 'rem');
  }
}

/* =========================================================
   SONIDO (WebAudio, sin archivos)
   ========================================================= */
let ctx = null;
function audio(){
  if (!S.sonido) return null;
  if (!ctx){ try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){ return null; } }
  return ctx;
}
function tic(){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'square'; o.frequency.value = 1400;
  g.gain.setValueAtTime(.06, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .04);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + .05);
}
function fanfarria(){
  const a = audio(); if (!a) return;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const t = a.currentTime + i * .13;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.18, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + (i === 3 ? 1.2 : .35));
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 1.3);
  });
}

/* =========================================================
   SORTEO
   ========================================================= */
function mostrarNombre(nombre){
  const el = $('nombre');
  el.textContent = nombre;
  el.style.fontSize = '';
  if (el.scrollWidth > el.clientWidth){
    const actual = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.floor(actual * el.clientWidth / el.scrollWidth * .96) + 'px';
  }
  el.classList.remove('tic'); void el.offsetWidth; el.classList.add('tic');
}

function sortear(){
  if (S.girando || S.ganadores.length >= S.cantidad) return;
  const disponibles = S.participantes.filter(n => !S.ganadores.includes(n));
  if (!disponibles.length) return;

  // El ganador se decide al principio, con azar criptográfico; la animación es solo para mostrarlo
  const elegido = disponibles[azar(disponibles.length)];

  S.girando = true;
  $('boton').disabled = true;
  const ventana = $('ventana');
  ventana.classList.remove('ganador');
  ventana.classList.add('girando');
  $('etiqueta').textContent = 'Sorteando el ' + (S.ganadores.length + 1) + '° premio…';
  $('ayuda').textContent = '';

  const inicio = performance.now();
  let anterior = '';
  const paso = () => {
    const t = performance.now() - inicio;
    if (t >= CONFIG.DURACION_GIRO_MS){ revelar(elegido); return; }
    let n;
    do { n = disponibles[Math.floor(Math.random() * disponibles.length)]; }
    while (disponibles.length > 1 && n === anterior);
    anterior = n;
    mostrarNombre(n);
    tic();
    const prog = t / CONFIG.DURACION_GIRO_MS;
    setTimeout(paso, 45 + 520 * Math.pow(prog, 2.4));   // empieza rápido y va frenando
  };
  paso();
}

function revelar(nombre){
  mostrarNombre(nombre);
  const ventana = $('ventana');
  ventana.classList.remove('girando');
  ventana.classList.add('ganador');
  const pos = S.ganadores.length + 1;
  $('etiqueta').textContent = '¡' + pos + '° ganador!';
  S.ganadores.push(nombre);

  fanfarria();
  confeti();

  const tarjeta = $('ganadores').children[pos - 1];
  setTimeout(() => {
    tarjeta.classList.add('lleno');
    tarjeta.querySelector('.quien').textContent = nombre;
    tarjeta.querySelector('.quien').title = nombre;
    const li = $('participantes').querySelector('li[data-nombre="' + CSS.escape(nombre) + '"]');
    if (li) li.classList.add('gano');
  }, 700);

  const d = new Date();
  setTimeout(() => {
    S.girando = false;
    if (S.ganadores.length >= S.cantidad){
      $('ayuda').textContent = '¡Felicitaciones a los ganadores!';
      $('boton').disabled = true;
      $('boton').textContent = 'Sorteo terminado';
      $('registro').textContent = 'Sorteo realizado el ' + DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) +
        ' a las ' + fmtHora(d) + ' entre ' + S.participantes.length + ' participantes. No recargues la página hasta anotar los ganadores.';
    } else {
      $('ayuda').textContent = 'Presioná ESPACIO para sortear el ' + (S.ganadores.length + 1) + '° premio';
      $('boton').disabled = false;
      $('boton').textContent = 'Sortear el ' + (S.ganadores.length + 1) + '° premio';
    }
  }, 1500);
}

/* =========================================================
   CONFETI
   ========================================================= */
const lienzo = $('confeti');
const c2d = lienzo.getContext('2d');
let piezas = [];
let animando = false;
function confeti(){
  lienzo.width = innerWidth; lienzo.height = innerHeight;
  const colores = ['#E9C46A','#F5B83D','#34C77B','#F2544F','#5B8DEF','#E8EEF7'];
  for (let i = 0; i < 220; i++){
    const desdeIzq = i % 2 === 0;
    piezas.push({
      x: desdeIzq ? 0 : lienzo.width,
      y: lienzo.height * (.55 + Math.random() * .25),
      vx: (desdeIzq ? 1 : -1) * (6 + Math.random() * 12),
      vy: -(12 + Math.random() * 14),
      r: 6 + Math.random() * 8,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .3,
      color: colores[i % colores.length],
      vida: 0
    });
  }
  if (!animando){ animando = true; requestAnimationFrame(cuadro); }
}
function cuadro(){
  c2d.clearRect(0, 0, lienzo.width, lienzo.height);
  piezas.forEach(p => {
    p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vida++;
    c2d.save(); c2d.translate(p.x, p.y); c2d.rotate(p.rot);
    c2d.fillStyle = p.color; c2d.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
    c2d.restore();
  });
  piezas = piezas.filter(p => p.y < lienzo.height + 40 && p.vida < 400);
  if (piezas.length) requestAnimationFrame(cuadro);
  else { animando = false; c2d.clearRect(0, 0, lienzo.width, lienzo.height); }
}

/* =========================================================
   RELOJ Y CONTROLES
   ========================================================= */
function reloj(){
  const d = new Date();
  $('hora').textContent = fmtHora(d);
  $('fecha').textContent = DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
}
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); sortear(); }
  else if (e.key === 'f' || e.key === 'F'){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }
  else if (e.key === 'm' || e.key === 'M'){ S.sonido = !S.sonido; }
});
$('boton').addEventListener('click', e => { e.currentTarget.blur(); sortear(); });
window.addEventListener('resize', ajustarLista);
// Aviso si se intenta cerrar o recargar con el sorteo empezado
window.addEventListener('beforeunload', e => { if (S.ganadores.length){ e.preventDefault(); e.returnValue = ''; } });

reloj();
setInterval(reloj, 1000);
cargar();
</script>
</body>
</html>
