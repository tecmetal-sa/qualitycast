<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de inyectoras · Pantalla de planta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PANTALLA DE PLANTA · Control de inyectoras (Tecmetal)
   Pensada para TV 16:9 a varios metros. Sin interacción.
   ========================================================= */
:root{
  --bg:#0D1624;
  --panel:#142036;
  --panel2:#1A2942;
  --line:#26374F;
  --text:#E8EEF7;
  --muted:#8C9DB8;
  --ok:#34C77B;
  --warn:#F5B83D;
  --bad:#F2544F;
  --idle:#56657D;
  --oro:#E9C46A;
  --iso-blue:#1E5BB8;
  --iso-yellow:#F6C400;
  --iso-red:#D7262E;
  --iso-green:#138A4B;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* Todo escala con la pantalla: en 1920x1080, 1rem = 16px */
html{font-size:min(calc(100vw / 120), calc(100vh / 67.5))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;cursor:none}
body{
  display:grid;
  grid-template-columns:minmax(0,1fr) 36rem;
  grid-template-rows:16rem minmax(0,1fr) 16.5rem auto;
  grid-template-areas:
    "cards reloj"
    "cards carteles"
    "recon carteles"
    "alert alert";
  gap:1rem;
  padding:1rem 1.25rem;
  height:100vh;
}

/* ---------- Reloj ---------- */
#reloj{grid-area:reloj;background:var(--panel);border-radius:.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hora{font:700 10.5rem/.9 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fecha{font:500 1.9rem/1.1 var(--sans);color:var(--muted);margin-top:.5rem}
.estado-datos{font:500 1.05rem/1.2 var(--sans);color:var(--muted);margin-top:.35rem;opacity:.8}
.estado-datos.caido{color:var(--bad);font-weight:600;opacity:1}

/* ---------- Tarjetas de inyectoras ---------- */
#tarjetas{grid-area:cards;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1rem;min-height:0}
.tarjeta{
  background:var(--panel);border-radius:.6rem;overflow:hidden;min-height:0;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  outline:.3rem solid transparent;outline-offset:-.3rem;
}
.placa{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 1.1rem;background:var(--idle);color:var(--text)}
.placa .nombre{font:700 2.8rem/1 var(--cond)}
.placa .estado{font:700 1.6rem/1 var(--cond);white-space:nowrap}
.cuerpo{padding:.4rem 1.1rem 0;display:flex;flex-direction:column;justify-content:center;min-height:0;min-width:0}
.tiempo{font:700 8.5rem/.95 var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.tarjeta[data-estado="idle"] .tiempo{font-size:4rem;color:var(--muted);line-height:1.05}
.sub{font:500 1.5rem/1.25 var(--sans);color:var(--muted)}
.quien{display:flex;justify-content:space-between;gap:.8rem;font:500 1.3rem/1.25 var(--sans);color:var(--muted);margin-top:.35rem;white-space:nowrap}
.quien .nom{overflow:hidden;text-overflow:ellipsis;min-width:0}
.quien .cuando{flex:none;font-variant-numeric:tabular-nums}
.quien b{color:var(--text);font-weight:600}
.medidor{height:.8rem;background:var(--panel2);border-radius:.4rem;margin-top:.9rem;overflow:hidden}
.medidor .relleno{height:100%;width:0;background:var(--idle);border-radius:.4rem;transition:width .9s linear}
.pie{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.7rem 1.1rem .9rem;font:500 1.2rem/1.2 var(--sans);color:var(--muted);white-space:nowrap}
.pie>span{overflow:hidden;text-overflow:ellipsis}
.pie .peso{flex:none}
.pie b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

.tarjeta[data-estado="ok"]   .placa{background:var(--ok);color:#0B1A12}
.tarjeta[data-estado="warn"] .placa{background:var(--warn);color:#1E1400}
.tarjeta[data-estado="bad"]  .placa{background:var(--bad);color:#1F0605}
.tarjeta[data-estado="ok"]   .relleno{background:var(--ok)}
.tarjeta[data-estado="warn"] .relleno{background:var(--warn)}
.tarjeta[data-estado="bad"]  .relleno{background:var(--bad)}
.tarjeta[data-estado="warn"] .tiempo{color:var(--warn)}
.tarjeta[data-estado="bad"]  .tiempo{color:var(--bad)}
.tarjeta[data-estado="bad"]{animation:latido 1.8s ease-in-out infinite}
@keyframes latido{0%,100%{outline-color:transparent}50%{outline-color:var(--bad)}}
.tarjeta.peso-alerta .peso b{color:var(--bad)}

/* ---------- Reconocimientos ---------- */
#recon{grid-area:recon;background:var(--panel);border-radius:.6rem;display:grid;grid-template-columns:minmax(0,1fr) 21rem;min-height:0;overflow:hidden}
.recon-principal{padding:1rem 1.4rem;display:flex;flex-direction:column;min-width:0;min-height:0}
.recon-principal h2{font:700 1.7rem/1 var(--cond);color:var(--oro)}
#reconPagina{flex:1;margin-top:.7rem;min-height:0;transition:opacity .6s ease}
#reconPagina.oculto{opacity:0}
.columnas{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2rem;height:100%}
.grupo h3{font:600 1.35rem/1.1 var(--cond);color:var(--muted);margin-bottom:.45rem}
.grupo ul{list-style:none}
.grupo li{font:600 1.55rem/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portada{height:100%;display:flex;flex-direction:column;justify-content:center}
.portada .etq{font:600 1.45rem/1.1 var(--cond);color:var(--muted)}
.portada .msj{font:700 3rem/1.05 var(--cond);color:var(--oro);margin-top:.35rem}
.portada .det{font:500 1.4rem/1.3 var(--sans);color:var(--muted);margin-top:.5rem}
.cumple{height:100%;display:flex;align-items:center;gap:2rem}
.cumple svg{width:9.5rem;height:9.5rem;flex:none}
.cumple .msj{font:700 3.4rem/1.02 var(--cond);color:var(--oro)}
.cumple .msj.largo{font-size:2.6rem}
.cumple p{font:500 1.8rem/1.3 var(--sans);color:var(--text);margin-top:.5rem}
.recon-vacio{font:500 1.35rem/1.4 var(--sans);color:var(--muted);max-width:40rem}
.recon-kpi{border-left:.15rem solid var(--line);padding:1rem 1.3rem;display:flex;flex-direction:column;justify-content:center}
.recon-kpi h2{font:600 1.35rem/1.15 var(--cond);color:var(--muted)}
.kpi-fila{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.5rem}
.kpi-num{font:700 3.6rem/1 var(--cond);font-variant-numeric:tabular-nums}
.kpi-lbl{font:500 1.1rem/1.3 var(--sans);color:var(--muted)}
.kpi-extra{font:500 1.1rem/1.3 var(--sans);color:var(--muted);margin-top:.6rem}
.kpi-extra b{color:var(--text)}

/* ---------- Carteles ---------- */
#carteles{grid-area:carteles;position:relative;background:var(--panel);border-radius:.6rem;overflow:hidden;min-height:0}
.cartel{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem 2rem 2.4rem;opacity:0;transition:opacity .8s ease;
  border-top:.7rem solid var(--estilo,var(--iso-green));
}
.cartel.on{opacity:1}
.cartel svg.signo{width:12rem;height:12rem;margin-bottom:1.5rem;flex:none}
.cartel h3{font:700 3.1rem/1.02 var(--cond);max-width:30rem}
.cartel p{font:500 1.55rem/1.35 var(--sans);color:var(--muted);margin-top:1rem;max-width:28rem}
.cartel.media{padding:0;border-top:none;background:#000}
.cartel.media img,.cartel.media video{width:100%;height:100%;object-fit:contain}
.cartel.media .pie-media{position:absolute;left:0;right:0;bottom:0;padding:1rem 1.2rem;background:linear-gradient(transparent,rgba(0,0,0,.85));font:700 2rem/1.1 var(--cond);text-align:left}

/* ---------- Franja de alertas de peso ---------- */
#alertas{grid-area:alert;display:none;background:var(--bad);color:#1F0605;border-radius:.6rem;padding:.8rem 1.4rem;align-items:center;gap:2rem;overflow:hidden}
#alertas.visible{display:flex}
#alertas .alerta-titulo{font:700 1.9rem/1 var(--cond);white-space:nowrap}
#alertas .alerta-lista{display:flex;gap:2.5rem;flex-wrap:wrap}
#alertas .alerta{font:600 1.5rem/1.2 var(--sans)}
#alertas .alerta b{font:700 1.8rem/1 var(--cond);margin-right:.5rem}

@media (prefers-reduced-motion: reduce){
  .tarjeta[data-estado="bad"]{animation:none;outline-color:var(--bad)}
  .cartel,#reconPagina,.medidor .relleno{transition:none}
}
</style>
</head>
<body>

<section id="tarjetas"></section>

<section id="reloj">
  <div class="hora" id="hora">--:--</div>
  <div class="fecha" id="fecha"></div>
  <div class="estado-datos" id="estadoDatos">Cargando datos…</div>
</section>

<section id="carteles"></section>

<section id="recon">
  <div class="recon-principal">
    <h2 id="reconTitulo">Reconocimientos del mes</h2>
    <div id="reconPagina"></div>
  </div>
  <div class="recon-kpi">
    <h2>Controles dentro de las 2 horas</h2>
    <div class="kpi-fila">
      <div><div class="kpi-num" id="kpiHoy">—</div><div class="kpi-lbl">Hoy</div></div>
      <div><div class="kpi-num" id="kpiSemana">—</div><div class="kpi-lbl">7 días</div></div>
    </div>
    <div class="kpi-extra" id="kpiExtra"></div>
  </div>
</section>

<section id="alertas">
  <div class="alerta-titulo">Revisar peso de pieza</div>
  <div class="alerta-lista" id="alertaLista"></div>
</section>

<script>
/* =========================================================
   CONFIGURACIÓN — todo lo ajustable está acá
   ========================================================= */
const CONFIG = {
  SHEET_ID: '1BTYqyVgdtOOkdsx7YfNxxmshRtk-o81y9d45ICE1ZNM', // planilla activa (cuenta de trabajo)
  HOJA_REGISTROS: 'Registros',
  HOJA_PANTALLA: 'Pantalla',              // pestaña opcional con los carteles
  HOJA_RECONOCIMIENTOS: 'Reconocimientos',// pestaña opcional con los reconocimientos
  HOJA_CUMPLES: 'Cumpleaños',             // pestaña opcional con los cumpleaños del año
  HOJA_SORTEO: 'Sorteo',                  // pestaña opcional con el sorteo (anuncio y ganadores)
  SORTEO_GANADORES_DIAS: 7,               // días que se muestran los ganadores
  CUMPLES_FINDE_EL_LUNES: true,           // los de sábado y domingo se saludan el lunes
  INYECTORAS: ['INY 4','INY 5','INY 6','INY 7','INY 8','INY 9'],

  PLAZO_MIN: 120,                         // cuenta regresiva: 2 h entre controles
  TOLERANCIA_MIN: 30,                     // amarillo durante 30 min después del plazo
  INACTIVA_DESDE_MIN: 240,                // gris "Parada" pasadas 4 h

  PESO_DESVIO_PCT: 5,                     // alerta si el peso se aleja más de este %
  PESO_MUESTRAS: 20,                      // controles previos del mismo código para la mediana
  PESO_MIN_MUESTRAS: 5,                   // mínimo de controles previos para poder comparar

  MOSTRAR_INYECTORA_DEL_MES: true,        // suma "Inyectora del mes" a los reconocimientos
  INYECTORA_MES_DIAS: 30,                 // período que se evalúa
  INYECTORA_MES_MIN_INTERVALOS: 15,       // mínimo de intervalos para competir

  NOMBRES_POR_GRUPO: 5,                   // nombres por columna en reconocimientos
  GRUPOS_POR_PAGINA: 3,                   // columnas visibles a la vez
  PAGINA_RECON_SEG: 10,                   // rotación de páginas de reconocimientos

  REFRESCO_DATOS_SEG: 60,                 // cada cuánto se leen los registros
  REFRESCO_HOJAS_MIN: 10,                 // cada cuánto se releen Pantalla y Reconocimientos
  RECARGA_PAGINA_MIN: 30,                 // recarga completa para tomar cambios del repo
  DURACION_CARTEL_SEG: 15,                // duración por defecto de cada cartel
  AVISO_SIN_CONEXION_MIN: 3               // tras este tiempo sin datos nuevos, aviso en rojo
};

// Carteles por defecto (se usan si la pestaña Pantalla no existe o está vacía)
const CARTELES_POR_DEFECTO = [
  {tipo:'texto', estilo:'obligacion',  titulo:'Usá protección auditiva',         texto:'Es obligatoria en toda el área de inyección.'},
  {tipo:'texto', estilo:'advertencia', titulo:'Superficies calientes',           texto:'Moldes, boquillas y cilindros queman. No los toques sin guantes.'},
  {tipo:'texto', estilo:'prohibicion', titulo:'Nunca metas la mano en el molde', texto:'Con la máquina en marcha, jamás. Pará la máquina antes de intervenir.'},
  {tipo:'texto', estilo:'info',        titulo:'Control cada 2 horas',            texto:'Cargá el control en la tablet aunque todo esté bien.'},
  {tipo:'texto', estilo:'obligacion',  titulo:'Usá anteojos de seguridad',       texto:'Al purgar y al limpiar la boquilla.'},
  {tipo:'texto', estilo:'advertencia', titulo:'Piso limpio, sin resbalones',     texto:'Juntá granos y rebabas del piso apenas caen.'}
];

const DEMO = new URLSearchParams(location.search).has('demo');

/* =========================================================
   ESTADO
   ========================================================= */
const state = {
  records: [],
  byM: {},
  lastOk: null,
  lastErr: null,
  carteles: CARTELES_POR_DEFECTO.slice(),
  cartelIdx: 0,
  cartelTimer: null,
  reconocimientos: [],
  cumples: [],
  sorteo: null,
  reconPagina: 0
};

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = id => document.getElementById(id);
function norm(s){
  return (s == null ? '' : String(s)).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
}
function normIny(s){
  if (!s) return '';
  return String(s).toUpperCase().replace(/\s+/g,' ').trim().replace(/^INY\s*(\d+)/, 'INY $1');
}
function mediana(arr){
  const a = arr.slice().sort((x,y)=>x-y);
  const m = Math.floor(a.length/2);
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}
/* Estado según minutos desde el último control */
function clasificar(min){
  if (min <= CONFIG.PLAZO_MIN) return 'ok';
  if (min <= CONFIG.PLAZO_MIN + CONFIG.TOLERANCIA_MIN) return 'warn';
  if (min <= CONFIG.INACTIVA_DESDE_MIN) return 'bad';
  return 'idle';
}
function hmm(min){
  const m = Math.max(0, Math.floor(min));
  return Math.floor(m/60) + ':' + String(m % 60).padStart(2,'0');
}
function fmtDur(min){
  const m = Math.max(0, Math.floor(min));
  if (m < 60) return m + ' min';
  const h = Math.floor(m/60);
  if (h < 24) return h + ' h ' + String(m % 60).padStart(2,'0') + ' min';
  const d = Math.floor(h/24);
  return d + (d === 1 ? ' día ' : ' días ') + (h % 24) + ' h';
}
function fmtPeso(p){
  return p.toLocaleString('es-AR', {maximumFractionDigits: p < 100 ? 2 : 0});
}
function fmtHora(d){
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* CSV con comillas, comas y saltos de línea dentro de celdas */
function parseCSV(text){
  const rows = []; let row = []; let f = ''; let q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){
        if (text[i+1] === '"'){ f += '"'; i++; } else q = false;
      } else f += c;
    } else {
      if (c === '"') q = true;
      else if (c === ','){ row.push(f); f = ''; }
      else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}

/* Pesos cargados en formatos mezclados: "2.265,00", "10,00", "756", "7.61" */
function parsePeso(v){
  if (v == null) return null;
  let s = String(v).trim().replace(/\s/g,'');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isFinite(n) && n > 0 ? n : null;
}

/* Timestamp ISO (UTC) si viene; si no, Fecha dd/mm/aaaa + Hora local */
function parseTs(tsRaw, fecha, hora){
  if (tsRaw){
    const s = String(tsRaw).trim();
    if (/^\d{4}-\d{2}-\d{2}T/.test(s)){
      const d = new Date(s);
      if (!isNaN(d)) return d;
    }
  }
  if (fecha){
    const m = String(fecha).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m){
      const h = String(hora || '').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      const d = new Date(+m[3], +m[2]-1, +m[1], h ? +h[1] : 0, h ? +h[2] : 0, h && h[3] ? +h[3] : 0);
      if (!isNaN(d)) return d;
    }
  }
  return null;
}

function gvizUrl(hoja){
  return 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID +
         '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(hoja) + '&_=' + Date.now();
}

/* Lee una pestaña opcional. Devuelve {h: encabezados normalizados, rows} o null.
   Si la pestaña no existe, gviz devuelve la primera hoja: se valida con columnas requeridas. */
async function leerHojaOpcional(nombre, requeridas){
  const res = await fetch(gvizUrl(nombre), {cache:'no-store'});
  if (!res.ok) return null;
  const txt = await res.text();
  if (txt.trim().startsWith('<')) return null;
  const rows = parseCSV(txt);
  if (!rows.length) return null;
  const h = rows[0].map(norm);
  if (!requeridas.some(r => h.includes(r))) return null;
  return {h, rows: rows.slice(1)};
}
function esInactivo(v){
  const a = norm(v);
  return a === 'no' || a === 'false' || a === '0';
}

/* =========================================================
   LECTURA DE REGISTROS
   ========================================================= */
function parseRegistros(txt){
  if (txt.trim().startsWith('<')) throw new Error('La planilla no es pública o la URL es incorrecta');
  const rows = parseCSV(txt);
  if (rows.length < 2) return [];
  const h = rows[0].map(norm);
  const idx = n => h.indexOf(norm(n));
  const iTs = idx('Timestamp'), iF = idx('Fecha'), iH = idx('Hora');
  const iI = idx('Inyectora'), iT = idx('Tipo Protector'), iC = idx('Código Pieza'), iO = idx('Operario');
  const iPesos = [];
  h.forEach((name, i) => { if (/^peso boca \d+$/.test(name)) iPesos.push(i); });
  if (iI < 0) throw new Error('No encuentro la columna Inyectora');

  const vistos = new Set();
  const out = [];
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    const iny = normIny(row[iI]);
    if (!iny) continue;
    const ts = parseTs(row[iTs], row[iF], row[iH]);
    if (!ts) continue;
    const clave = iny + '|' + ts.getTime();          // descarta duplicados de la cola offline
    if (vistos.has(clave)) continue;
    vistos.add(clave);
    const pesos = iPesos.map(i => parsePeso(row[i])).filter(v => v != null);
    out.push({
      ts,
      iny,
      tipo: (row[iT] || '').trim(),
      codigo: (row[iC] || '').trim(),
      operario: iO >= 0 ? (row[iO] || '').trim() : '',
      peso: pesos.length ? pesos.reduce((a,b)=>a+b, 0) / pesos.length : null
    });
  }
  out.sort((a,b) => a.ts - b.ts);
  return out;
}

function indexar(){
  state.byM = {};
  CONFIG.INYECTORAS.forEach(i => state.byM[i] = []);
  state.records.forEach(r => { if (state.byM[r.iny]) state.byM[r.iny].push(r); });
}

async function cargarRegistros(){
  try{
    if (DEMO){
      state.records = datosDemo();
    } else {
      const res = await fetch(gvizUrl(CONFIG.HOJA_REGISTROS), {cache:'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const recs = parseRegistros(await res.text());
      if (!recs.length) throw new Error('La hoja no devolvió registros');
      state.records = recs;
    }
    state.lastOk = new Date();
    state.lastErr = null;
  } catch (e){
    state.lastErr = e;
    console.error('Error leyendo registros:', e);
  }
  indexar();
  renderDatos();
}

/* =========================================================
   CONTROL DE PESO
   ========================================================= */
function evaluarPeso(rec){
  if (rec._eval !== undefined) return rec._eval;
  rec._eval = null;
  if (rec.peso == null || !rec.codigo) return null;
  const previos = [];
  for (let i = state.records.length - 1; i >= 0 && previos.length < CONFIG.PESO_MUESTRAS; i--){
    const r = state.records[i];
    if (r === rec || r.ts > rec.ts) continue;
    if (r.codigo === rec.codigo && r.peso != null) previos.push(r.peso);
  }
  if (previos.length < CONFIG.PESO_MIN_MUESTRAS) return null;
  const ref = mediana(previos);
  if (!ref) return null;
  const dev = (rec.peso - ref) / ref * 100;
  rec._eval = {ref, dev, alerta: Math.abs(dev) > CONFIG.PESO_DESVIO_PCT};
  return rec._eval;
}

function setTexto(el, v){ if (el.textContent !== v) el.textContent = v; }

/* Achica la fuente si el texto no entra en el ancho (por ej. si no cargó la tipografía) */
function ajustarAncho(el){
  const clave = el.textContent.length + '|' + el.clientWidth;
  if (el._clave === clave) return;
  el._clave = clave;
  el.style.fontSize = '';
  const w = el.clientWidth;
  if (w && el.scrollWidth > w){
    const actual = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.floor(actual * w / el.scrollWidth * 0.97) + 'px';
  }
}

function renderTarjetas(now){
  if (!state.lastOk) return;
  CONFIG.INYECTORAS.forEach(iny => {
    const T = tarjetas[iny];
    const recs = state.byM[iny] || [];
    const last = recs[recs.length - 1];
    if (!last){
      T.card.dataset.estado = 'idle';
      setTexto(T.estado, TEXTO_ESTADO.idle);
      setTexto(T.tiempo, 'Sin registros');
      setTexto(T.sub, '');
      T.quien.textContent = '';
      T.relleno.style.width = '0';
      setTexto(T.codigo, '—'); setTexto(T.tipo, ''); setTexto(T.peso, '—');
      T.card.classList.remove('peso-alerta');
      return;
    }
    const min = (now - last.ts) / 60000;
    const est = clasificar(min);
    if (T.card.dataset.estado !== est) T.card.dataset.estado = est;
    setTexto(T.estado, TEXTO_ESTADO[est]);

    if (est === 'ok'){
      // Cuenta regresiva hasta el próximo control (redondeo hacia arriba: 1:59:30 se ve 2:00)
      setTexto(T.tiempo, hmm(Math.ceil(CONFIG.PLAZO_MIN - min)));
      setTexto(T.sub, 'para el próximo control');
      T.relleno.style.width = Math.max(0, (CONFIG.PLAZO_MIN - min) / CONFIG.PLAZO_MIN) * 100 + '%';
    } else if (est === 'warn'){
      const resta = CONFIG.PLAZO_MIN + CONFIG.TOLERANCIA_MIN - min;
      setTexto(T.tiempo, hmm(Math.ceil(resta)));
      setTexto(T.sub, 'de tolerancia');
      T.relleno.style.width = Math.max(0, resta / CONFIG.TOLERANCIA_MIN) * 100 + '%';
    } else if (est === 'bad'){
      // Atraso contado desde el vencimiento (2 h), no desde el fin de la tolerancia
      setTexto(T.tiempo, '+' + hmm(min - CONFIG.PLAZO_MIN));
      setTexto(T.sub, 'de atraso');
      T.relleno.style.width = '100%';
    } else {
      setTexto(T.tiempo, 'Sin actividad');
      setTexto(T.sub, 'Último control hace ' + fmtDur(min));
      T.relleno.style.width = '0';
    }

    renderQuien(T.quien, last, now);
    ajustarAncho(T.tiempo);
    setTexto(T.codigo, last.codigo || '—');
    setTexto(T.tipo, last.tipo ? '(' + last.tipo.toLowerCase() + ')' : '');

  });
}

/* Intervalos entre controles de una máquina desde una fecha (sin contar paradas) */
function intervalos(recs, desde){
  let ok = 0, tot = 0;
  for (let i = 1; i < recs.length; i++){
    if (recs[i].ts < desde) continue;
    const gap = (recs[i].ts - recs[i-1].ts) / 60000;
    if (gap > CONFIG.INACTIVA_DESDE_MIN) continue;
    tot++;
    if (gap <= CONFIG.PLAZO_MIN) ok++;
  }
  return {ok, tot};
}

function renderKpi(now){
  const hoy0 = new Date(now); hoy0.setHours(0,0,0,0);
  const semana0 = now - 7 * 86400000;
  let okH = 0, totH = 0, okS = 0, totS = 0, cargasHoy = 0;
  CONFIG.INYECTORAS.forEach(iny => {
    const recs = state.byM[iny] || [];
    recs.forEach(r => { if (r.ts >= hoy0) cargasHoy++; });
    const h = intervalos(recs, hoy0), s = intervalos(recs, semana0);
    okH += h.ok; totH += h.tot; okS += s.ok; totS += s.tot;
  });
  $('kpiHoy').textContent = totH ? Math.round(okH / totH * 100) + '%' : '—';
  $('kpiSemana').textContent = totS ? Math.round(okS / totS * 100) + '%' : '—';
  const ex = $('kpiExtra');
  ex.textContent = '';
  const b = document.createElement('b');
  b.textContent = cargasHoy;
  ex.append(b, document.createTextNode(cargasHoy === 1 ? ' control cargado hoy' : ' controles cargados hoy'));
}

async function cargarReconocimientos(){
  if (DEMO){ state.reconocimientos = reconDemo(); return; }
  try{
    const hoja = await leerHojaOpcional(CONFIG.HOJA_RECONOCIMIENTOS, ['categoria','nombre']);
    if (!hoja) return;
    const {h, rows} = hoja;
    const iCat = h.indexOf('categoria'), iNom = h.indexOf('nombre'), iDet = h.indexOf('detalle'), iAct = h.indexOf('activo');
    if (iCat < 0 || iNom < 0) return;
    const lista = [];
    rows.forEach(row => {
      const g = i => (i >= 0 && row[i] != null ? String(row[i]).trim() : '');
      if (esInactivo(g(iAct))) return;
      if (!g(iNom)) return;
      const categoria = g(iCat) || 'Reconocimientos';
      if (/cumple/i.test(categoria)) return;          // los cumpleaños van en su propia pestaña
      lista.push({categoria, nombre: g(iNom), detalle: g(iDet)});
    });
    state.reconocimientos = lista;
  } catch (e){
    console.warn('No se pudo leer la pestaña Reconocimientos.', e);
  }
}

/* Pestaña Cumpleaños: Nombre (+ Apellido opcional) y Fecha día/mes */
async function cargarCumples(){
  if (DEMO){ state.cumples = cumplesDemo(); return; }
  try{
    const hoja = await leerHojaOpcional(CONFIG.HOJA_CUMPLES, ['fecha']);
    if (!hoja) return;
    const {h, rows} = hoja;
    const iN = h.indexOf('nombre'), iA = h.indexOf('apellido'), iF = h.indexOf('fecha'), iAct = h.indexOf('activo');
    if (iF < 0 || (iN < 0 && iA < 0)) return;          // así descarta la hoja Registros si la pestaña no existe
    const lista = [];
    rows.forEach(row => {
      const g = i => (i >= 0 && row[i] != null ? String(row[i]).trim() : '');
      if (esInactivo(g(iAct))) return;
      const m = g(iF).match(/^(\d{1,2})[\/\-.](\d{1,2})/);
      if (!m) return;
      const nombre = [g(iN), g(iA)].filter(Boolean).join(' ');
      if (!nombre) return;
      lista.push({nombre, dia: +m[1], mes: +m[2]});
    });
    state.cumples = lista;
  } catch (e){
    console.warn('No se pudo leer la pestaña Cumpleaños.', e);
  }
}

/* "Inyectora del mes": mejor % de controles en tiempo en el período */
function inyectoraDelMes(now){
  const desde = now - CONFIG.INYECTORA_MES_DIAS * 86400000;
  let mejor = null;
  CONFIG.INYECTORAS.forEach(iny => {
    const {ok, tot} = intervalos(state.byM[iny] || [], desde);
    if (tot < CONFIG.INYECTORA_MES_MIN_INTERVALOS) return;
    const pct = ok / tot;
    if (!mejor || pct > mejor.pct || (pct === mejor.pct && tot > mejor.tot)) mejor = {iny, pct, tot};
  });
  return mejor;
}

/* "Ana", "Ana y Juan", "Ana, Juan e Iván" */
function unirNombres(arr){
  if (arr.length <= 1) return arr.join('');
  const ultimo = arr[arr.length - 1];
  const y = /^h?i(?![aeiouáéó])/i.test(ultimo) ? ' e ' : ' y ';
  return arr.slice(0, -1).join(', ') + y + ultimo;
}
function minusculaInicial(t){ return t ? t.charAt(0).toLowerCase() + t.slice(1) : t; }

function mismoDia(c, d){ return c.dia === d.getDate() && c.mes === d.getMonth() + 1; }

function paginasCumple(){
  const d = new Date();
  const res = [];
  const hoy = state.cumples.filter(c => mismoDia(c, d)).map(c => c.nombre);
  if (hoy.length) res.push({tipo:'cumple', nombres: hoy, atrasado: false});
  if (CONFIG.CUMPLES_FINDE_EL_LUNES && d.getDay() === 1){
    const finde = [1, 2].map(n => { const x = new Date(d); x.setDate(d.getDate() - n); return x; });
    const at = state.cumples.filter(c => finde.some(x => mismoDia(c, x))).map(c => c.nombre);
    if (at.length) res.push({tipo:'cumple', nombres: at, atrasado: true});
  }
  return res;
}

/* =========================================================
   SORTEO: anuncio antes de la fecha y ganadores después
   Pestaña Sorteo: Fecha, Hora, Premio, Cantidad, Participantes, Ganadores
   (se usa la última fila con datos)
   ========================================================= */
async function cargarSorteo(){
  if (DEMO){ state.sorteo = sorteoDemo(); return; }
  try{
    const hoja = await leerHojaOpcional(CONFIG.HOJA_SORTEO, ['premio']);
    if (!hoja){ state.sorteo = null; return; }
    const {h, rows} = hoja;
    const fila = rows.filter(r => r.some(c => String(c).trim())).pop();
    if (!fila){ state.sorteo = null; return; }
    const g = n => { const i = h.indexOf(n); return i >= 0 && fila[i] != null ? String(fila[i]).trim() : ''; };
    const mf = g('fecha').match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/);
    if (!mf){ state.sorteo = null; return; }
    const hoy = new Date();
    let anio = mf[3] ? +mf[3] : hoy.getFullYear();
    if (anio < 100) anio += 2000;
    const mh = g('hora').match(/^(\d{1,2})(?::(\d{2}))?/);
    const fecha = new Date(anio, +mf[2] - 1, +mf[1], mh ? +mh[1] : 0, mh && mh[2] ? +mh[2] : 0);
    const ganadores = [];
    h.forEach((nombre, i) => {
      if (!/^ganador/.test(nombre)) return;
      String(fila[i] || '').split(/[,;\n]/).map(x => x.trim()).filter(Boolean).forEach(x => ganadores.push(x));
    });
    state.sorteo = {
      fecha,
      tieneHora: !!mh,
      premio: g('premio') || 'premios',
      participantes: g('participantes') || 'Asistencia perfecta',
      ganadores
    };
  } catch (e){
    console.warn('No se pudo leer la pestaña Sorteo.', e);
  }
}

function contarParticipantes(categoria){
  const c = norm(categoria);
  return new Set(state.reconocimientos.filter(r => norm(r.categoria) === c).map(r => norm(r.nombre))).size;
}

function paginasSorteo(){
  const s = state.sorteo;
  if (!s) return [];
  const now = new Date();
  if (now < s.fecha) return [{tipo:'sorteo-anuncio', s}];
  if (s.ganadores.length && now - s.fecha < CONFIG.SORTEO_GANADORES_DIAS * 86400000) return [{tipo:'sorteo-ganadores', s}];
  return [];
}

/* "este viernes a las 12", "mañana a las 12:30", "el viernes 16/10 a las 12" */
function cuandoSorteo(s, now){
  const d0 = new Date(now); d0.setHours(0,0,0,0);
  const f0 = new Date(s.fecha); f0.setHours(0,0,0,0);
  const dd = Math.round((f0 - d0) / 86400000);
  const f = s.fecha;
  let dia = dd === 0 ? 'hoy' : dd === 1 ? 'mañana' : dd < 7 ? 'este ' + DIAS[f.getDay()]
          : 'el ' + DIAS[f.getDay()] + ' ' + f.getDate() + '/' + (f.getMonth() + 1);
  if (s.tieneHora){
    const h = f.getMinutes() ? fmtHora(f) : String(f.getHours());
    dia += (f.getHours() === 1 ? ' a la ' : ' a las ') + h;
  }
  let faltan;
  const min = (s.fecha - now) / 60000;
  if (dd >= 2) faltan = 'Faltan ' + dd + ' días.';
  else if (dd === 1) faltan = '¡Es mañana!';
  else if (s.tieneHora && min <= 60) faltan = '¡Faltan ' + Math.max(1, Math.ceil(min)) + ' minutos!';
  else faltan = '¡Es hoy!';
  return {dia, faltan};
}

/* Secuencia de páginas: por categoría una portada de felicitación y después los nombres.
   Si hay cumpleaños, se intercalan entre cada página. */
function paginasRecon(){
  const pags = [];
  const grupos = new Map();
  state.reconocimientos.forEach(r => {
    if (!grupos.has(r.categoria)) grupos.set(r.categoria, []);
    grupos.get(r.categoria).push(r);
  });
  grupos.forEach((items, cat) => {
    pags.push({tipo:'portada', categoria: cat, items});
    if (items.length > 1){
      const cols = [];
      for (let i = 0; i < items.length; i += CONFIG.NOMBRES_POR_GRUPO) cols.push(items.slice(i, i + CONFIG.NOMBRES_POR_GRUPO));
      for (let j = 0; j < cols.length; j += CONFIG.GRUPOS_POR_PAGINA) pags.push({tipo:'nombres', categoria: cat, columnas: cols.slice(j, j + CONFIG.GRUPOS_POR_PAGINA)});
    }
  });
  if (CONFIG.MOSTRAR_INYECTORA_DEL_MES && state.lastOk){
    const m = inyectoraDelMes(Date.now());
    if (m) pags.push({tipo:'inyectora', iny: m.iny, pct: m.pct});
  }
  const especiales = paginasCumple().concat(paginasSorteo());
  if (!especiales.length) return pags;
  if (!pags.length) return especiales;
  const out = [];
  let k = 0;
  pags.forEach(p => { out.push(especiales[k++ % especiales.length]); out.push(p); });
  return out;
}

  }

  if (p.tipo === 'cumple'){
    setTexto(titulo, p.atrasado ? 'Cumpleaños del fin de semana' : 'Cumpleaños de hoy');
    const div = el('div', 'cumple');
    div.innerHTML = TORTA_SVG;
    const txt = el('div');
    const nombres = unirNombres(p.nombres);
    const msj = el('div', 'msj', '¡Feliz cumpleaños' + (p.atrasado ? ' atrasado' : '') + ', ' + nombres + '!');
    if (msj.textContent.length > 48) msj.classList.add('largo');
    const varios = p.nombres.length > 1;
    const sub = p.atrasado
      ? (varios ? 'Que hayan tenido un muy lindo día.' : 'Que hayas tenido un muy lindo día.')
      : (varios ? 'Que tengan un muy lindo día.' : 'Que tengas un muy lindo día.');
    txt.append(msj, el('p', null, sub));
    div.appendChild(txt);
    cont.appendChild(div);
    return;
  }

  setTexto(titulo, 'Reconocimientos del mes');

  if (p.tipo === 'portada'){
    const div = el('div', 'portada');
    const n = p.items.length;
    const cat = minusculaInicial(p.categoria);
    const msj = n === 1
      ? '¡Felicitaciones, ' + p.items[0].nombre + ', por su ' + cat + '!'
      : '¡Felicitaciones a las ' + n + ' personas con ' + cat + '!';
    div.append(el('div', 'etq', p.categoria), el('div', 'msj', msj));
    if (n === 1 && p.items[0].detalle) div.appendChild(el('div', 'det', p.items[0].detalle));
    cont.appendChild(div);
    return;
  }

  if (p.tipo === 'inyectora'){
    const div = el('div', 'portada');
    div.append(
      el('div', 'etq', 'Inyectora del mes'),
      el('div', 'msj', '¡Felicitaciones al equipo de la ' + p.iny + '!'),
      el('div', 'det', Math.round(p.pct * 100) + '% de los controles en tiempo en los últimos ' + CONFIG.INYECTORA_MES_DIAS + ' días')
    );
    cont.appendChild(div);
    return;
  }

  // Página de nombres
  const cols = el('div', 'columnas');
  p.columnas.forEach(items => {
    const g = el('div', 'grupo');
    g.appendChild(el('h3', null, p.categoria));
    const ul = el('ul');
    items.forEach(it => ul.appendChild(el('li', null, it.nombre)));
    g.appendChild(ul);
    cols.appendChild(g);
  });
  cont.appendChild(cols);
}

function rotarRecon(){
  const total = Math.max(1, paginasRecon().length);
  if (total === 1){ state.reconPagina = 0; renderRecon(); return; }
  const cont = $('reconPagina');
  cont.classList.add('oculto');
  setTimeout(() => {
    state.reconPagina = (state.reconPagina + 1) % total;
    renderRecon();
    cont.classList.remove('oculto');
  }, 600);
}

/* =========================================================
   CARTELES (carrusel)
   ========================================================= */
const COLOR_ESTILO = {
  obligacion: 'var(--iso-blue)',
  advertencia: 'var(--iso-yellow)',
  prohibicion: 'var(--iso-red)',
  info: 'var(--iso-green)'
};
function signoSvg(estilo){
  switch (estilo){
    case 'obligacion':
      return '<svg class="signo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1E5BB8"/>' +
             '<rect x="44" y="20" width="12" height="40" rx="5" fill="#fff"/><circle cx="50" cy="75" r="7" fill="#fff"/></svg>';
    case 'advertencia':
      return '<svg class="signo" viewBox="0 0 100 100"><path d="M50 6 L96 90 H4 Z" fill="#F6C400" stroke="#111" stroke-width="6" stroke-linejoin="round"/>' +
             '<rect x="45" y="34" width="10" height="30" rx="4" fill="#111"/><circle cx="50" cy="75" r="6" fill="#111"/></svg>';
    case 'prohibicion':
      return '<svg class="signo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#D7262E" stroke-width="12"/>' +
             '<line x1="21" y1="21" x2="79" y2="79" stroke="#D7262E" stroke-width="12"/></svg>';
    default:
      return '<svg class="signo" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="8" fill="#138A4B"/>' +
             '<circle cx="50" cy="27" r="8" fill="#fff"/><rect x="43" y="42" width="14" height="40" rx="4" fill="#fff"/></svg>';
  }
}

async function cargarCarteles(){
  if (DEMO) return;
  try{
    const hoja = await leerHojaOpcional(CONFIG.HOJA_PANTALLA, ['titulo','texto','archivo']);
    if (!hoja) return;
    const {h, rows} = hoja;
    const idx = n => h.indexOf(n);
    const iTipo = idx('tipo'), iEst = idx('estilo'), iTit = idx('titulo'), iTxt = idx('texto'),
          iArch = idx('archivo'), iDur = idx('duracion'), iAct = idx('activo');
    const lista = [];
    rows.forEach(row => {
      const g = i => (i >= 0 && row[i] != null ? String(row[i]).trim() : '');
      if (esInactivo(g(iAct))) return;
      const tipo = norm(g(iTipo)) || 'texto';
      const c = {
        tipo: (tipo === 'imagen' || tipo === 'video') ? tipo : 'texto',
        estilo: norm(g(iEst)) || 'info',
        titulo: g(iTit),
        texto: g(iTxt),
        archivo: g(iArch),
        dur: parseFloat(g(iDur).replace(',', '.')) || null
      };
      if (c.tipo === 'texto' && !c.titulo && !c.texto) return;
      if (c.tipo !== 'texto' && !c.archivo) return;
      lista.push(c);
    });
    if (lista.length) state.carteles = lista;
  } catch (e){
    console.warn('No se pudo leer la pestaña Pantalla, sigo con los carteles actuales.', e);
  }
}

function mostrarCartel(){
  const lista = state.carteles;
  const cont = $('carteles');
  clearTimeout(state.cartelTimer);
  if (!lista.length) return;
  state.cartelIdx = state.cartelIdx % lista.length;
  const c = lista[state.cartelIdx];

  const div = document.createElement('div');
  div.className = 'cartel';
  let durMs = (c.dur || CONFIG.DURACION_CARTEL_SEG) * 1000;

  if (c.tipo === 'imagen' || c.tipo === 'video'){
    div.classList.add('media');
    if (c.tipo === 'imagen'){
      const img = document.createElement('img');
      img.src = c.archivo; img.alt = c.titulo || '';
      img.onerror = siguienteCartel;
      div.appendChild(img);
    } else {
      const v = document.createElement('video');
      v.src = c.archivo; v.muted = true; v.autoplay = true; v.playsInline = true;
      v.onended = siguienteCartel;
      v.onerror = siguienteCartel;
      div.appendChild(v);
      if (!c.dur) durMs = 5 * 60000;    // tope de seguridad si no termina
    }
    if (c.titulo){
      const p = document.createElement('div');
      p.className = 'pie-media';
      p.textContent = c.titulo;
      div.appendChild(p);
    }
  } else {
    div.style.setProperty('--estilo', COLOR_ESTILO[c.estilo] || COLOR_ESTILO.info);
    div.innerHTML = signoSvg(c.estilo) + '<h3></h3><p></p>';
    div.querySelector('h3').textContent = c.titulo;
    div.querySelector('p').textContent = c.texto;
  }

  const viejos = Array.from(cont.children);
  cont.appendChild(div);
  requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('on')));
  viejos.forEach(v => { v.classList.remove('on'); setTimeout(() => v.remove(), 900); });

  state.cartelTimer = setTimeout(siguienteCartel, durMs);
}
function siguienteCartel(){
  clearTimeout(state.cartelTimer);
  state.cartelIdx = (state.cartelIdx + 1) % Math.max(1, state.carteles.length);
  mostrarCartel();
}

/* =========================================================
   MODO DEMO (pantalla.html?demo) — datos inventados para probar
   ========================================================= */
const OPERARIOS_DEMO = ['Castel Atilio','Esquivel Cristian','Ledesma José','Robles Arnaldo','Vélez Julio','Quispe Pedro'];
function datosDemo(){
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const now = Date.now();
  const perfiles = {
    'INY 4': {codigo:'23002898', tipo:'BISELADO', peso:26,   hace:35},
    'INY 5': {codigo:'23026706', tipo:'BALDE',    peso:1001, hace:128},
    'INY 6': {codigo:'23026438', tipo:'BALDE',    peso:2278, hace:162},
    'INY 7': {codigo:'23024905', tipo:'ROSCADO',  peso:90,   hace:70},
    'INY 8': {codigo:'23006177', tipo:'BISELADO', peso:125,  hace:300},
    'INY 9': {codigo:'23026884', tipo:'BALDE',    peso:2034, hace:50, desvio:true}
  };
  const out = [];
  Object.keys(perfiles).forEach(iny => {
    const p = perfiles[iny];
    let t = now - p.hace * 60000;
    let primero = true;
    while (t > now - 35 * 86400000){
      const hr = new Date(t).getHours();
      if (hr < 6){ t -= 5 * 3600000; continue; }
      let peso = p.peso * (1 + (rnd() - .5) * .03);
      if (primero && p.desvio) peso = p.peso * .84;
      out.push({ts:new Date(t), iny, tipo:p.tipo, codigo:p.codigo, operario:OPERARIOS_DEMO[Math.floor(rnd() * OPERARIOS_DEMO.length)], peso});
      primero = false;
      const r = rnd();
      t -= (r < .75 ? 60 + rnd() * 55 : r < .9 ? 125 + rnd() * 20 : 155 + rnd() * 50) * 60000;
    }
  });
  out.sort((a,b) => a.ts - b.ts);
  return out;
}

/* =========================================================
   ARRANQUE Y CICLOS
   ========================================================= */
function renderDatos(){
  if (!state.lastOk) return;             // hasta tener datos, las tarjetas quedan en "Cargando…"
  const now = Date.now();
  renderTarjetas(now);
  renderAlertas(now);
  renderKpi(now);
  renderRecon();
}

async function pedirPantallaEncendida(){
  try{ if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e){}
}

async function cargarHojas(){
  await Promise.all([cargarCarteles(), cargarReconocimientos(), cargarCumples(), cargarSorteo()]);
  renderRecon();
}

function iniciar(){
  crearTarjetas();
  renderReloj();
  mostrarCartel();
  cargarHojas();
  cargarRegistros();

  setInterval(() => { renderReloj(); renderTarjetas(Date.now()); }, 1000);   // reloj y cuentas regresivas
  setInterval(() => { const n = Date.now(); renderAlertas(n); renderKpi(n); }, 30000);
  setInterval(rotarRecon, CONFIG.PAGINA_RECON_SEG * 1000);
  setInterval(cargarRegistros, CONFIG.REFRESCO_DATOS_SEG * 1000);
  setInterval(cargarHojas, CONFIG.REFRESCO_HOJAS_MIN * 60000);

  // Recarga completa periódica, solo si el servidor responde (evita quedar en una página de error)
  setInterval(async () => {
    try{
      const r = await fetch(location.href, {cache:'no-store'});
      if (r.ok) location.reload();
    } catch (e){}
  }, CONFIG.RECARGA_PAGINA_MIN * 60000);

  pedirPantallaEncendida();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pedirPantallaEncendida(); });
}
iniciar();
