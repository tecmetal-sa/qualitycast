<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de inyectoras · Pantalla de planta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PANTALLA DE PLANTA · Control de inyectoras (Tecmetal)
   Pensada para TV 16:9 a varios metros. Sin interacción.
   ========================================================= */
:root{
  --bg:#0D1624;
  --panel:#142036;
  --panel2:#1A2942;
  --line:#26374F;
  --text:#E8EEF7;
  --muted:#8C9DB8;
  --ok:#34C77B;
  --warn:#F5B83D;
  --bad:#F2544F;
  --idle:#56657D;
  --iso-blue:#1E5BB8;
  --iso-yellow:#F6C400;
  --iso-red:#D7262E;
  --iso-green:#138A4B;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* Todo escala con la pantalla: en 1920x1080, 1rem = 16px */
html{font-size:min(calc(100vw / 120), calc(100vh / 67.5))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;cursor:none}
body{
  display:grid;
  grid-template-columns:minmax(0,1fr) 34rem;
  grid-template-rows:4.5rem minmax(0,1.1fr) minmax(0,1fr) auto;
  grid-template-areas:"head head" "cards side" "time side" "alert alert";
  gap:1rem;
  padding:1rem 1.25rem;
  height:100vh;
}

/* ---------- Encabezado ---------- */
header{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:2rem}
.titulo{font:700 2.6rem/1 var(--cond);letter-spacing:.01em}
.leyenda{display:flex;gap:1.6rem;align-items:center;font:500 1.25rem/1 var(--cond);color:var(--muted)}
.leyenda span{display:flex;align-items:center;gap:.5rem}
.leyenda i{width:1.1rem;height:1.1rem;border-radius:.25rem;display:inline-block}
.reloj{text-align:right;line-height:1}
.hora{font:700 3rem/1 var(--cond);font-variant-numeric:tabular-nums}
.fecha{font:500 1.15rem/1.2 var(--sans);color:var(--muted);margin-top:.15rem}
.estado-datos{font:500 1rem/1.2 var(--sans);color:var(--muted)}
.estado-datos.caido{color:var(--bad);font-weight:600}

/* ---------- Tarjetas de inyectoras ---------- */
#tarjetas{grid-area:cards;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1rem}
.tarjeta{
  background:var(--panel);border-radius:.6rem;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;
  outline:.25rem solid transparent;outline-offset:-.25rem;
}
.placa{
  display:flex;align-items:center;justify-content:space-between;
  padding:.45rem 1rem;background:var(--idle);color:var(--text);
}
.placa .nombre{font:700 2.4rem/1 var(--cond)}
.placa .estado{font:600 1.35rem/1 var(--cond);white-space:nowrap}
.cuerpo{padding:.6rem 1rem 0;display:flex;flex-direction:column;justify-content:center;min-height:0}
.tiempo{font:700 4.8rem/1 var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.tarjeta[data-estado="idle"] .tiempo{font-size:3.2rem;color:var(--muted)}
.sub{font:500 1.15rem/1.3 var(--sans);color:var(--muted)}
.medidor{position:relative;height:.7rem;background:var(--panel2);border-radius:.35rem;margin-top:.7rem;overflow:hidden}
.medidor .relleno{position:absolute;inset:0 auto 0 0;width:0;background:var(--idle);border-radius:.35rem;transition:width .6s ease}
.medidor .marca{position:absolute;top:0;bottom:0;width:.18rem;background:var(--bg);left:80%}
.pie{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.55rem 1rem .7rem;font:500 1.15rem/1.2 var(--sans);color:var(--muted);white-space:nowrap}
.pie>span{overflow:hidden;text-overflow:ellipsis}
.pie .peso{flex:none}
.pie b{color:var(--text);font-weight:600}
.pie .peso b{font-variant-numeric:tabular-nums}

.tarjeta[data-estado="ok"]   .placa{background:var(--ok);color:#0B1A12}
.tarjeta[data-estado="warn"] .placa{background:var(--warn);color:#1E1400}
.tarjeta[data-estado="bad"]  .placa{background:var(--bad);color:#1F0605}
.tarjeta[data-estado="ok"]   .relleno{background:var(--ok)}
.tarjeta[data-estado="warn"] .relleno{background:var(--warn)}
.tarjeta[data-estado="bad"]  .relleno{background:var(--bad)}
.tarjeta[data-estado="bad"]{animation:latido 1.8s ease-in-out infinite}
@keyframes latido{0%,100%{outline-color:transparent}50%{outline-color:var(--bad)}}
.tarjeta.peso-alerta .peso b{color:var(--bad)}

/* ---------- Línea de tiempo ---------- */
#linea{grid-area:time;background:var(--panel);border-radius:.6rem;padding:.8rem 1rem .6rem;display:flex;flex-direction:column;min-height:0}
#linea h2{font:600 1.35rem/1 var(--cond);color:var(--muted);margin-bottom:.2rem}
#lineaCaja{flex:1;min-height:0;position:relative}
#lineaSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tick{stroke:var(--line);stroke-width:1}
.tick-lbl{fill:var(--muted);font:500 1.05rem var(--cond)}
.ahora{stroke:var(--text);stroke-width:2;stroke-dasharray:4 5;opacity:.55}
.ahora-lbl{fill:var(--text);font:600 1.05rem var(--cond)}
.fila-sep{stroke:var(--line);stroke-width:1;opacity:.5}
.fila-lbl{fill:var(--text);font:700 1.6rem var(--cond)}
.base{stroke:var(--line);stroke-width:2}
.seg{stroke-width:.6rem;stroke-linecap:round}
.seg-ok{stroke:var(--ok)}
.seg-warn{stroke:var(--warn)}
.seg-bad{stroke:var(--bad)}
.seg-idle{stroke:var(--idle);stroke-width:.25rem;stroke-dasharray:.35rem .5rem;stroke-linecap:butt}
.seg-abierto{opacity:.5}
.punto{fill:var(--text);stroke:var(--panel);stroke-width:.2rem}
.punto-alerta{fill:var(--bad);stroke:var(--text);stroke-width:.2rem}
.seg-lbl{font:700 1.2rem var(--cond)}
.lbl-warn{fill:var(--warn)}
.lbl-bad{fill:var(--bad)}
.lbl-idle{fill:var(--muted);font-weight:500}

/* ---------- Columna lateral ---------- */
#lateral{grid-area:side;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1rem;min-height:0}
#carteles{position:relative;background:var(--panel);border-radius:.6rem;overflow:hidden}
.cartel{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem 2rem 2.4rem;opacity:0;transition:opacity .8s ease;
  border-top:.7rem solid var(--estilo,var(--iso-green));
}
.cartel.on{opacity:1}
.cartel svg.signo{width:13rem;height:13rem;margin-bottom:1.6rem;flex:none}
.cartel h3{font:700 3.1rem/1.02 var(--cond);max-width:28rem}
.cartel p{font:500 1.55rem/1.35 var(--sans);color:var(--muted);margin-top:1rem;max-width:26rem}
.cartel.media{padding:0;border-top:none;background:#000}
.cartel.media img,.cartel.media video{width:100%;height:100%;object-fit:contain}
.cartel.media .pie-media{position:absolute;left:0;right:0;bottom:0;padding:1rem 1.2rem;background:linear-gradient(transparent,rgba(0,0,0,.85));font:700 2rem/1.1 var(--cond);text-align:left}

#kpi{background:var(--panel);border-radius:.6rem;padding:1rem 1.2rem 1.1rem}
#kpi h2{font:600 1.35rem/1.2 var(--cond);color:var(--muted)}
.kpi-fila{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.6rem}
.kpi-num{font:700 3.8rem/1 var(--cond);font-variant-numeric:tabular-nums}
.kpi-lbl{font:500 1.1rem/1.3 var(--sans);color:var(--muted)}
.kpi-extra{font:500 1.1rem/1.3 var(--sans);color:var(--muted);margin-top:.7rem}
.kpi-extra b{color:var(--text)}

/* ---------- Franja de alertas de peso ---------- */
#alertas{grid-area:alert;display:none;background:var(--bad);color:#1F0605;border-radius:.6rem;padding:.8rem 1.4rem;align-items:center;gap:2rem;overflow:hidden}
#alertas.visible{display:flex}
#alertas .alerta-titulo{font:700 1.9rem/1 var(--cond);white-space:nowrap}
#alertas .alerta-lista{display:flex;gap:2.5rem;flex-wrap:wrap}
#alertas .alerta{font:600 1.5rem/1.2 var(--sans)}
#alertas .alerta b{font:700 1.8rem/1 var(--cond);margin-right:.5rem}

.cargando{font:600 1.6rem/1.3 var(--cond);color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  .tarjeta[data-estado="bad"]{animation:none;outline-color:var(--bad)}
  .cartel{transition:none}
  .medidor .relleno{transition:none}
}
</style>
</head>
<body>

<header>
  <div class="titulo">Control de inyectoras</div>
  <div class="leyenda" aria-label="Referencias de color">
    <span><i style="background:var(--ok)"></i>Hasta 2 h</span>
    <span><i style="background:var(--warn)"></i>De 2 a 2:30 h</span>
    <span><i style="background:var(--bad)"></i>Más de 2:30 h</span>
    <span><i style="background:var(--idle)"></i>Sin actividad (+4 h)</span>
  </div>
  <div class="reloj">
    <div class="hora" id="hora">--:--</div>
    <div class="fecha" id="fecha"></div>
    <div class="estado-datos" id="estadoDatos">Cargando datos…</div>
  </div>
</header>

<section id="tarjetas"></section>

<section id="linea">
  <h2>Controles de las últimas 12 horas</h2>
  <div id="lineaCaja"><svg id="lineaSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
</section>

<aside id="lateral">
  <div id="carteles"></div>
  <div id="kpi">
    <h2>Controles dentro de las 2 horas</h2>
    <div class="kpi-fila">
      <div><div class="kpi-num" id="kpiHoy">—</div><div class="kpi-lbl">Hoy</div></div>
      <div><div class="kpi-num" id="kpiSemana">—</div><div class="kpi-lbl">Últimos 7 días</div></div>
    </div>
    <div class="kpi-extra" id="kpiExtra"></div>
  </div>
</aside>

<section id="alertas">
  <div class="alerta-titulo">Revisar peso de pieza</div>
  <div class="alerta-lista" id="alertaLista"></div>
</section>

<script>
/* =========================================================
   CONFIGURACIÓN — todo lo ajustable está acá
   ========================================================= */
const CONFIG = {
  SHEET_ID: '1BTYqyVgdtOOkdsx7YfNxxmshRtk-o81y9d45ICE1ZNM', // planilla activa (cuenta de trabajo)
  HOJA_REGISTROS: 'Registros',
  HOJA_PANTALLA: 'Pantalla',          // pestaña opcional con los carteles
  INYECTORAS: ['INY 4','INY 5','INY 6','INY 7','INY 8','INY 9'],

  VERDE_HASTA_MIN: 120,               // verde hasta 2 h
  AMARILLO_HASTA_MIN: 150,            // amarillo hasta 2:30 h, después rojo
  INACTIVA_DESDE_MIN: 240,            // gris "sin actividad" pasadas 4 h

  PESO_DESVIO_PCT: 5,                 // alerta si el peso se aleja más de este %
  PESO_MUESTRAS: 20,                  // controles previos del mismo código para la mediana
  PESO_MIN_MUESTRAS: 5,               // mínimo de controles previos para poder comparar

  VENTANA_HS: 12,                     // horas que muestra la línea de tiempo
  REFRESCO_DATOS_SEG: 60,             // cada cuánto se leen los registros
  REFRESCO_CARTELES_MIN: 10,          // cada cuánto se relee la pestaña Pantalla
  RECARGA_PAGINA_MIN: 30,             // recarga completa para tomar cambios del repo
  DURACION_CARTEL_SEG: 15,            // duración por defecto de cada cartel
  AVISO_SIN_CONEXION_MIN: 3           // tras este tiempo sin datos nuevos, aviso en rojo
};

// Carteles por defecto (se usan si la pestaña Pantalla no existe o está vacía)
const CARTELES_POR_DEFECTO = [
  {tipo:'texto', estilo:'obligacion',  titulo:'Usá protección auditiva',       texto:'Es obligatoria en toda el área de inyección.'},
  {tipo:'texto', estilo:'advertencia', titulo:'Superficies calientes',         texto:'Moldes, boquillas y cilindros queman. No los toques sin guantes.'},
  {tipo:'texto', estilo:'prohibicion', titulo:'Nunca metas la mano en el molde', texto:'Con la máquina en marcha, jamás. Pará la máquina antes de intervenir.'},
  {tipo:'texto', estilo:'info',        titulo:'Control cada 2 horas',          texto:'Cargá el control en la tablet aunque todo esté bien.'},
  {tipo:'texto', estilo:'obligacion',  titulo:'Usá anteojos de seguridad',     texto:'Al purgar y al limpiar la boquilla.'},
  {tipo:'texto', estilo:'advertencia', titulo:'Piso limpio, sin resbalones',   texto:'Juntá granos y rebabas del piso apenas caen.'}
];

const DEMO = new URLSearchParams(location.search).has('demo');

/* =========================================================
   ESTADO
   ========================================================= */
const state = {
  records: [],
  byM: {},
  lastOk: null,
  lastErr: null,
  carteles: CARTELES_POR_DEFECTO.slice(),
  cartelIdx: 0,
  cartelTimer: null
};

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function norm(s){
  return (s == null ? '' : String(s)).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
}
function normIny(s){
  if (!s) return '';
  let v = String(s).toUpperCase().replace(/\s+/g,' ').trim();
  v = v.replace(/^INY\s*(\d+)/, 'INY $1');
  return v;
}
function mediana(arr){
  const a = arr.slice().sort((x,y)=>x-y);
  const m = Math.floor(a.length/2);
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}
function clasificar(min){
  if (min <= CONFIG.VERDE_HASTA_MIN) return 'ok';
  if (min <= CONFIG.AMARILLO_HASTA_MIN) return 'warn';
  if (min <= CONFIG.INACTIVA_DESDE_MIN) return 'bad';
  return 'idle';
}
function fmtDur(min){
  const m = Math.max(0, Math.floor(min));
  if (m < 60) return m + ' min';
  const h = Math.floor(m/60);
  if (h < 24) return h + ' h ' + String(m % 60).padStart(2,'0') + ' min';
  const d = Math.floor(h/24);
  return d + (d === 1 ? ' día ' : ' días ') + (h % 24) + ' h';
}
function fmtGrande(min){
  const m = Math.max(0, Math.floor(min));
  if (m < 60) return m + ' min';
  return Math.floor(m/60) + ':' + String(m % 60).padStart(2,'0') + ' h';
}
function fmtCorto(min){
  const m = Math.max(0, Math.round(min));
  if (m < 60) return m + ' min';
  const h = Math.floor(m/60);
  if (h >= 24) return Math.floor(h/24) + ' d ' + (h % 24) + ' h';
  return h + ':' + String(m % 60).padStart(2,'0') + ' h';
}
function fmtPeso(p){
  return p.toLocaleString('es-AR', {maximumFractionDigits: p < 100 ? 2 : 0});
}
function fmtHora(d){
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* CSV con comillas, comas y saltos de línea dentro de celdas */
function parseCSV(text){
  const rows = []; let row = []; let f = ''; let q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){
        if (text[i+1] === '"'){ f += '"'; i++; } else q = false;
      } else f += c;
    } else {
      if (c === '"') q = true;
      else if (c === ','){ row.push(f); f = ''; }
      else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}

/* Pesos cargados en formatos mezclados: "2.265,00", "10,00", "756", "7.61" */
function parsePeso(v){
  if (v == null) return null;
  let s = String(v).trim().replace(/\s/g,'');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isFinite(n) && n > 0 ? n : null;
}

/* Timestamp ISO (UTC) si viene; si no, Fecha dd/mm/aaaa + Hora local */
function parseTs(tsRaw, fecha, hora){
  if (tsRaw){
    const s = String(tsRaw).trim();
    if (/^\d{4}-\d{2}-\d{2}T/.test(s)){
      const d = new Date(s);
      if (!isNaN(d)) return d;
    }
  }
  if (fecha){
    const m = String(fecha).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m){
      const h = String(hora || '').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      const d = new Date(+m[3], +m[2]-1, +m[1], h ? +h[1] : 0, h ? +h[2] : 0, h && h[3] ? +h[3] : 0);
      if (!isNaN(d)) return d;
    }
  }
  return null;
}

function gvizUrl(hoja){
  return 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID +
         '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(hoja) + '&_=' + Date.now();
}

/* =========================================================
   LECTURA DE REGISTROS
   ========================================================= */
function parseRegistros(txt){
  if (txt.trim().startsWith('<')) throw new Error('La planilla no es pública o la URL es incorrecta');
  const rows = parseCSV(txt);
  if (rows.length < 2) return [];
  const h = rows[0].map(norm);
  const idx = n => h.indexOf(norm(n));
  const iTs = idx('Timestamp'), iF = idx('Fecha'), iH = idx('Hora');
  const iI = idx('Inyectora'), iT = idx('Tipo Protector'), iC = idx('Código Pieza');
  const iPesos = [];
  h.forEach((name, i) => { if (/^peso boca \d+$/.test(name)) iPesos.push(i); });
  if (iI < 0) throw new Error('No encuentro la columna Inyectora');

  const vistos = new Set();
  const out = [];
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    const iny = normIny(row[iI]);
    if (!iny) continue;
    const ts = parseTs(row[iTs], row[iF], row[iH]);
    if (!ts) continue;
    const clave = iny + '|' + ts.getTime();          // descarta duplicados de la cola offline
    if (vistos.has(clave)) continue;
    vistos.add(clave);
    const pesos = iPesos.map(i => parsePeso(row[i])).filter(v => v != null);
    out.push({
      ts,
      iny,
      tipo: (row[iT] || '').trim(),
      codigo: (row[iC] || '').trim(),
      peso: pesos.length ? pesos.reduce((a,b)=>a+b, 0) / pesos.length : null
    });
  }
  out.sort((a,b) => a.ts - b.ts);
  return out;
}

function indexar(){
  state.byM = {};
  CONFIG.INYECTORAS.forEach(i => state.byM[i] = []);
  state.records.forEach(r => { if (state.byM[r.iny]) state.byM[r.iny].push(r); });
}

async function cargarRegistros(){
  try{
    if (DEMO){
      state.records = datosDemo();
    } else {
      const res = await fetch(gvizUrl(CONFIG.HOJA_REGISTROS), {cache:'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const recs = parseRegistros(await res.text());
      if (!recs.length) throw new Error('La hoja no devolvió registros');
      state.records = recs;
    }
    state.lastOk = new Date();
    state.lastErr = null;
  } catch (e){
    state.lastErr = e;
    console.error('Error leyendo registros:', e);
  }
  indexar();
  renderTodo();
}

/* =========================================================
   CONTROL DE PESO
   ========================================================= */
function evaluarPeso(rec){
  if (rec._eval !== undefined) return rec._eval;
  rec._eval = null;
  if (rec.peso == null || !rec.codigo) return null;
  const previos = [];
  for (let i = state.records.length - 1; i >= 0 && previos.length < CONFIG.PESO_MUESTRAS; i--){
    const r = state.records[i];
    if (r === rec || r.ts > rec.ts) continue;
    if (r.codigo === rec.codigo && r.peso != null) previos.push(r.peso);
  }
  if (previos.length < CONFIG.PESO_MIN_MUESTRAS) return null;
  const ref = mediana(previos);
  if (!ref) return null;
  const dev = (rec.peso - ref) / ref * 100;
  rec._eval = {ref, dev, alerta: Math.abs(dev) > CONFIG.PESO_DESVIO_PCT};
  return rec._eval;
}

/* =========================================================
   RENDER: TARJETAS
   ========================================================= */
const tarjetas = {};
function crearTarjetas(){
  const cont = $('tarjetas');
  CONFIG.INYECTORAS.forEach(iny => {
    const t = document.createElement('article');
    t.className = 'tarjeta';
    t.dataset.estado = 'idle';
    t.innerHTML =
      '<div class="placa"><span class="nombre"></span><span class="estado"></span></div>' +
      '<div class="cuerpo"><div class="tiempo cargando">Cargando…</div><div class="sub"></div>' +
      '<div class="medidor"><div class="relleno"></div><div class="marca"></div></div></div>' +
      '<div class="pie"><span>Pieza <b class="codigo">—</b> <span class="tipo"></span></span>' +
      '<span class="peso">Peso <b>—</b></span></div>';
    t.querySelector('.nombre').textContent = iny;
    cont.appendChild(t);
    tarjetas[iny] = {
      card: t,
      estado: t.querySelector('.estado'),
      tiempo: t.querySelector('.tiempo'),
      sub: t.querySelector('.sub'),
      relleno: t.querySelector('.relleno'),
      codigo: t.querySelector('.codigo'),
      tipo: t.querySelector('.tipo'),
      peso: t.querySelector('.peso b')
    };
  });
}

const TEXTO_ESTADO = {ok:'Al día', warn:'Por vencer', bad:'Vencido', idle:'Parada'};

function renderTarjetas(now){
  CONFIG.INYECTORAS.forEach(iny => {
    const T = tarjetas[iny];
    const recs = state.byM[iny] || [];
    const last = recs[recs.length - 1];
    T.tiempo.classList.remove('cargando');
    if (!last){
      T.card.dataset.estado = 'idle';
      T.estado.textContent = TEXTO_ESTADO.idle;
      T.tiempo.textContent = 'Sin registros';
      T.sub.textContent = '';
      T.relleno.style.width = '0';
      T.codigo.textContent = '—'; T.tipo.textContent = ''; T.peso.textContent = '—';
      T.card.classList.remove('peso-alerta');
      return;
    }
    const min = (now - last.ts) / 60000;
    const est = clasificar(min);
    T.card.dataset.estado = est;
    T.estado.textContent = TEXTO_ESTADO[est];
    if (est === 'idle'){
      T.tiempo.textContent = 'Sin actividad';
      T.sub.textContent = 'Último control hace ' + fmtDur(min);
      T.relleno.style.width = '0';
    } else {
      T.tiempo.textContent = fmtGrande(min);
      T.sub.textContent = 'desde el último control';
      T.relleno.style.width = Math.min(min / CONFIG.AMARILLO_HASTA_MIN, 1) * 100 + '%';
    }
    T.codigo.textContent = last.codigo || '—';
    T.tipo.textContent = last.tipo ? '(' + last.tipo.toLowerCase() + ')' : '';
    T.peso.textContent = last.peso != null ? fmtPeso(last.peso) + ' g' : '—';
    const ev = evaluarPeso(last);
    T.card.classList.toggle('peso-alerta', !!(ev && ev.alerta && est !== 'idle'));
  });
}

/* =========================================================
   RENDER: LÍNEA DE TIEMPO
   ========================================================= */
function renderLinea(now){
  const caja = $('lineaCaja');
  const svg = $('lineaSvg');
  const W = caja.clientWidth, H = caja.clientHeight;
  if (!W || !H) return;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.textContent = '';

  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const L = rem * 6.5, R = rem * 1.2, T = rem * 2.2, B = rem * .4;
  const t0 = now - CONFIG.VENTANA_HS * 3600000;
  const x = t => L + (Math.max(t, t0) - t0) / (now - t0) * (W - L - R);
  const n = CONFIG.INYECTORAS.length;
  const rowH = (H - T - B) / n;

  // Horas
  const xAhora = x(now);
  const primera = new Date(t0); primera.setMinutes(0,0,0);
  for (let tick = primera.getTime() + 3600000; tick <= now; tick += 3600000){
    const xx = x(tick);
    svgEl('line', {x1:xx, x2:xx, y1:T - rem*.4, y2:H - B, class:'tick'}, svg);
    const hh = new Date(tick).getHours();
    if (hh % 2 === 0 && xAhora - xx > rem * 4){
      const tx = svgEl('text', {x:xx, y:rem*1.3, 'text-anchor':'middle', class:'tick-lbl'}, svg);
      tx.textContent = String(hh).padStart(2,'0') + ':00';
    }
  }
  svgEl('line', {x1:xAhora, x2:xAhora, y1:T - rem*.6, y2:H - B, class:'ahora'}, svg);
  const ta = svgEl('text', {x:xAhora, y:rem*1.3, 'text-anchor':'end', class:'ahora-lbl'}, svg);
  ta.textContent = 'ahora';

  CONFIG.INYECTORAS.forEach((iny, k) => {
    const cy = T + rowH * k + rowH / 2;
    if (k > 0) svgEl('line', {x1:0, x2:W, y1:T + rowH*k, y2:T + rowH*k, class:'fila-sep'}, svg);
    const lbl = svgEl('text', {x:0, y:cy, 'dominant-baseline':'central', class:'fila-lbl'}, svg);
    lbl.textContent = iny;
    svgEl('line', {x1:L, x2:W - R, y1:cy, y2:cy, class:'base'}, svg);

    const recs = state.byM[iny] || [];
    let inicio = recs.findIndex(r => r.ts >= t0);
    if (inicio < 0) inicio = recs.length;
    const vis = recs.slice(Math.max(0, inicio - 1));   // incluye el anterior a la ventana
    const gSeg = svgEl('g', {}, svg), gLbl = svgEl('g', {}, svg), gPto = svgEl('g', {}, svg);

    const segmento = (ta, tb, gap, abierto) => {
      if (tb < t0) return;
      const c = clasificar(gap);
      const x1 = x(ta), x2 = x(tb);
      svgEl('line', {x1, x2, y1:cy, y2:cy, class:'seg seg-' + c + (abierto ? ' seg-abierto' : '')}, gSeg);
      const ancho = x2 - x1;
      let txt = null;
      if ((c === 'warn' || c === 'bad') && ancho > rem * 4) txt = fmtCorto(gap);
      else if (c === 'idle' && ancho > rem * 9) txt = 'sin actividad';
      if (txt){
        const t = svgEl('text', {x:(x1 + x2) / 2, y:cy - rem*.8, 'text-anchor':'middle', class:'seg-lbl lbl-' + c}, gLbl);
        t.textContent = txt;
      }
    };
    for (let i = 1; i < vis.length; i++){
      segmento(vis[i-1].ts, vis[i].ts, (vis[i].ts - vis[i-1].ts) / 60000, false);
    }
    const ultimo = vis[vis.length - 1];
    if (ultimo) segmento(ultimo.ts, now, (now - ultimo.ts) / 60000, true);

    vis.forEach(r => {
      if (r.ts < t0) return;
      const ev = evaluarPeso(r);
      const alerta = !!(ev && ev.alerta);
      svgEl('circle', {cx:x(r.ts), cy, r: alerta ? rem*.55 : rem*.38, class: 'punto' + (alerta ? ' punto-alerta' : '')}, gPto);
    });
  });
}

/* =========================================================
   RENDER: ALERTAS, KPI, ENCABEZADO
   ========================================================= */
function renderAlertas(now){
  const lista = $('alertaLista');
  lista.textContent = '';
  let hay = 0;
  CONFIG.INYECTORAS.forEach(iny => {
    const recs = state.byM[iny] || [];
    const last = recs[recs.length - 1];
    if (!last) return;
    if (clasificar((now - last.ts) / 60000) === 'idle') return;
    const ev = evaluarPeso(last);
    if (!ev || !ev.alerta) return;
    hay++;
    const d = document.createElement('div');
    d.className = 'alerta';
    const signo = ev.dev > 0 ? '+' : '−';
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = iny;
    d.querySelector('span').textContent =
      'pieza ' + last.codigo + ': ' + fmtPeso(last.peso) + ' g, lo habitual es ' +
      fmtPeso(ev.ref) + ' g (' + signo + Math.abs(ev.dev).toFixed(0) + '%)';
    lista.appendChild(d);
  });
  $('alertas').classList.toggle('visible', hay > 0);
}

function renderKpi(now){
  const hoy0 = new Date(now); hoy0.setHours(0,0,0,0);
  const semana0 = now - 7 * 86400000;
  let okH = 0, totH = 0, okS = 0, totS = 0, cargasHoy = 0;
  CONFIG.INYECTORAS.forEach(iny => {
    const recs = state.byM[iny] || [];
    recs.forEach((r, i) => {
      if (r.ts >= hoy0) cargasHoy++;
      if (i === 0) return;
      const gap = (r.ts - recs[i-1].ts) / 60000;
      if (gap > CONFIG.INACTIVA_DESDE_MIN) return;       // paradas no cuentan
      const ok = gap <= CONFIG.VERDE_HASTA_MIN;
      if (r.ts >= semana0){ totS++; if (ok) okS++; }
      if (r.ts >= hoy0){ totH++; if (ok) okH++; }
    });
  });
  $('kpiHoy').textContent = totH ? Math.round(okH / totH * 100) + '%' : '—';
  $('kpiSemana').textContent = totS ? Math.round(okS / totS * 100) + '%' : '—';
  $('kpiExtra').innerHTML = '';
  const b = document.createElement('b');
  b.textContent = cargasHoy;
  $('kpiExtra').append(b, document.createTextNode(cargasHoy === 1 ? ' control cargado hoy' : ' controles cargados hoy'));
}

const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function renderReloj(){
  const d = new Date();
  $('hora').textContent = fmtHora(d);
  $('fecha').textContent = DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
  const est = $('estadoDatos');
  if (!state.lastOk){
    est.textContent = state.lastErr ? 'Sin conexión con la planilla' : 'Cargando datos…';
    est.classList.toggle('caido', !!state.lastErr);
    return;
  }
  const sinDatosMin = (d - state.lastOk) / 60000;
  if (sinDatosMin > CONFIG.AVISO_SIN_CONEXION_MIN){
    est.textContent = 'Sin datos nuevos desde las ' + fmtHora(state.lastOk);
    est.classList.add('caido');
  } else {
    est.textContent = (DEMO ? 'Modo demo · ' : '') + 'Datos al ' + fmtHora(state.lastOk);
    est.classList.remove('caido');
  }
}

function renderTodo(){
  const now = Date.now();
  if (!state.lastOk) return;           // hasta tener datos, las tarjetas quedan en "Cargando…"
  renderTarjetas(now);
  renderLinea(now);
  renderAlertas(now);
  renderKpi(now);
}

/* =========================================================
   CARTELES (carrusel)
   ========================================================= */
const COLOR_ESTILO = {
  obligacion: 'var(--iso-blue)',
  advertencia: 'var(--iso-yellow)',
  prohibicion: 'var(--iso-red)',
  info: 'var(--iso-green)'
};
function signoSvg(estilo){
  switch (estilo){
    case 'obligacion':
      return '<svg class="signo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1E5BB8"/>' +
             '<rect x="44" y="20" width="12" height="40" rx="5" fill="#fff"/><circle cx="50" cy="75" r="7" fill="#fff"/></svg>';
    case 'advertencia':
      return '<svg class="signo" viewBox="0 0 100 100"><path d="M50 6 L96 90 H4 Z" fill="#F6C400" stroke="#111" stroke-width="6" stroke-linejoin="round"/>' +
             '<rect x="45" y="34" width="10" height="30" rx="4" fill="#111"/><circle cx="50" cy="75" r="6" fill="#111"/></svg>';
    case 'prohibicion':
      return '<svg class="signo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#D7262E" stroke-width="12"/>' +
             '<line x1="21" y1="21" x2="79" y2="79" stroke="#D7262E" stroke-width="12"/></svg>';
    default:
      return '<svg class="signo" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="8" fill="#138A4B"/>' +
             '<circle cx="50" cy="27" r="8" fill="#fff"/><rect x="43" y="42" width="14" height="40" rx="4" fill="#fff"/></svg>';
  }
}

async function cargarCarteles(){
  if (DEMO) return;
  try{
    const res = await fetch(gvizUrl(CONFIG.HOJA_PANTALLA), {cache:'no-store'});
    if (!res.ok) return;
    const txt = await res.text();
    if (txt.trim().startsWith('<')) return;
    const rows = parseCSV(txt);
    if (rows.length < 2) return;
    const h = rows[0].map(norm);
    const idx = n => h.indexOf(n);
    const iTipo = idx('tipo'), iEst = idx('estilo'), iTit = idx('titulo'), iTxt = idx('texto'),
          iArch = idx('archivo'), iDur = idx('duracion'), iAct = idx('activo');
    // Si la pestaña no existe, gviz devuelve la primera hoja: la descartamos
    if (iTit < 0 && iTxt < 0 && iArch < 0) return;
    const lista = [];
    for (let r = 1; r < rows.length; r++){
      const row = rows[r];
      const g = i => (i >= 0 && row[i] != null ? String(row[i]).trim() : '');
      const activo = norm(g(iAct));
      if (activo === 'no' || activo === 'false' || activo === '0') continue;
      const tipo = norm(g(iTipo)) || 'texto';
      const c = {
        tipo: (tipo === 'imagen' || tipo === 'video') ? tipo : 'texto',
        estilo: norm(g(iEst)).replace('obligación','obligacion') || 'info',
        titulo: g(iTit),
        texto: g(iTxt),
        archivo: g(iArch),
        dur: parseFloat(g(iDur).replace(',', '.')) || null
      };
      if (c.tipo === 'texto' && !c.titulo && !c.texto) continue;
      if (c.tipo !== 'texto' && !c.archivo) continue;
      lista.push(c);
    }
    if (lista.length){
      const antes = JSON.stringify(state.carteles);
      state.carteles = lista;
      if (antes !== JSON.stringify(lista) && !$('carteles').children.length) mostrarCartel();
    }
  } catch (e){
    console.warn('No se pudo leer la pestaña Pantalla, sigo con los carteles actuales.', e);
  }
}

function mostrarCartel(){
  const lista = state.carteles;
  const cont = $('carteles');
  clearTimeout(state.cartelTimer);
  if (!lista.length) return;
  state.cartelIdx = state.cartelIdx % lista.length;
  const c = lista[state.cartelIdx];

  const div = document.createElement('div');
  div.className = 'cartel';
  let durMs = (c.dur || CONFIG.DURACION_CARTEL_SEG) * 1000;

  if (c.tipo === 'imagen' || c.tipo === 'video'){
    div.classList.add('media');
    if (c.tipo === 'imagen'){
      const img = document.createElement('img');
      img.src = c.archivo; img.alt = c.titulo || '';
      img.onerror = siguienteCartel;
      div.appendChild(img);
    } else {
      const v = document.createElement('video');
      v.src = c.archivo; v.muted = true; v.autoplay = true; v.playsInline = true;
      v.onended = siguienteCartel;
      v.onerror = siguienteCartel;
      div.appendChild(v);
      if (!c.dur) durMs = 5 * 60000;    // tope de seguridad si no termina
    }
    if (c.titulo){
      const p = document.createElement('div');
      p.className = 'pie-media';
      p.textContent = c.titulo;
      div.appendChild(p);
    }
  } else {
    div.style.setProperty('--estilo', COLOR_ESTILO[c.estilo] || COLOR_ESTILO.info);
    div.innerHTML = signoSvg(c.estilo) + '<h3></h3><p></p>';
    div.querySelector('h3').textContent = c.titulo;
    div.querySelector('p').textContent = c.texto;
  }

  const viejos = Array.from(cont.children);
  cont.appendChild(div);
  requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('on')));
  viejos.forEach(v => { v.classList.remove('on'); setTimeout(() => v.remove(), 900); });

  state.cartelTimer = setTimeout(siguienteCartel, durMs);
}
function siguienteCartel(){
  clearTimeout(state.cartelTimer);
  state.cartelIdx = (state.cartelIdx + 1) % Math.max(1, state.carteles.length);
  mostrarCartel();
}

/* =========================================================
   MODO DEMO (pantalla.html?demo) — datos inventados para probar
   ========================================================= */
function datosDemo(){
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const now = Date.now();
  const perfiles = {
    'INY 4': {codigo:'23002898', tipo:'BISELADO', peso:26,   hace:35},
    'INY 5': {codigo:'23026706', tipo:'BALDE',    peso:1001, hace:128},
    'INY 6': {codigo:'23026438', tipo:'BALDE',    peso:2278, hace:162},
    'INY 7': {codigo:'23024905', tipo:'ROSCADO',  peso:90,   hace:70},
    'INY 8': {codigo:'23006177', tipo:'BISELADO', peso:125,  hace:300},
    'INY 9': {codigo:'23026884', tipo:'BALDE',    peso:2034, hace:50, desvio:true}
  };
  const out = [];
  Object.keys(perfiles).forEach(iny => {
    const p = perfiles[iny];
    let t = now - p.hace * 60000;
    let primero = true;
    while (t > now - 3 * 86400000){
      const hr = new Date(t).getHours();
      if (hr < 6){ t -= 5 * 3600000; continue; }
      let peso = p.peso * (1 + (rnd() - .5) * .03);
      if (primero && p.desvio) peso = p.peso * .84;
      out.push({ts:new Date(t), iny, tipo:p.tipo, codigo:p.codigo, peso});
      primero = false;
      const r = rnd();
      t -= (r < .75 ? 60 + rnd() * 55 : r < .9 ? 125 + rnd() * 20 : 155 + rnd() * 50) * 60000;
    }
  });
  out.sort((a,b) => a.ts - b.ts);
  return out;
}

/* =========================================================
   ARRANQUE Y CICLOS
   ========================================================= */
async function pedirPantallaEncendida(){
  try{ if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e){}
}

function iniciar(){
  crearTarjetas();
  renderReloj();
  mostrarCartel();
  cargarCarteles();
  cargarRegistros();

  setInterval(renderReloj, 1000);
  setInterval(renderTodo, 15000);                                   // el tiempo transcurrido avanza solo
  setInterval(cargarRegistros, CONFIG.REFRESCO_DATOS_SEG * 1000);
  setInterval(cargarCarteles, CONFIG.REFRESCO_CARTELES_MIN * 60000);

  // Recarga completa periódica, solo si el servidor responde (evita quedar en una página de error)
  setInterval(async () => {
    try{
      const r = await fetch(location.href, {cache:'no-store'});
      if (r.ok) location.reload();
    } catch (e){}
  }, CONFIG.RECARGA_PAGINA_MIN * 60000);

  let resizeT;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(renderTodo, 200); });

  pedirPantallaEncendida();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pedirPantallaEncendida(); });
}
iniciar();
